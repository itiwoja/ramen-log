<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<style id="cjg">html{visibility:hidden}</style>
<script>if(self===top){document.documentElement.style.visibility='visible'}else{try{top.location=self.location}catch(e){}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF8F5" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#19120D" media="(prefers-color-scheme:dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<title>麺帳 トロフィー</title>
<script src="achievements.js"></script>
<style>
/* ============================================================
   麺帳 トロフィー — Apple HIG (iOS) reskin
   Clarity / Deference / Depth。UIは控えめ・コンテンツ主役。
   セマンティック色トークン（Light/Dark）は index.html と同一。
   tint = 醤油の琥珀。獲得=tint・未獲得=淡色。
   JS・id・class・データキー（ramenLog.v1）は一切変更していない。
   見た目層（style と最小マークアップ）のみ作り替え。
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  /* === M3 カラーロール（Light・暖色シード #8F4E00）: index.html と同一 === */
  --md-primary:#8F4E00; --md-on-primary:#FFFFFF;
  --md-primary-container:#FFDCC2; --md-on-primary-container:#2E1500;
  --md-secondary:#755844; --md-on-secondary:#FFFFFF;
  --md-secondary-container:#FFDCC2; --md-on-secondary-container:#2A1706;
  --md-tertiary:#5F6234; --md-on-tertiary:#FFFFFF;
  --md-tertiary-container:#E5E8AD; --md-on-tertiary-container:#1B1D00;
  --md-error:#BA1A1A; --md-on-error:#FFFFFF;
  --md-error-container:#FFDAD6; --md-on-error-container:#410002;
  --md-surface:#FFF8F5; --md-on-surface:#211A15; --md-on-surface-variant:#52443B;
  --md-surface-container-lowest:#FFFFFF; --md-surface-container-low:#FFF1E9;
  --md-surface-container:#FCEBE0; --md-surface-container-high:#F6E5DA;
  --md-surface-container-highest:#F0E0D5;
  --md-outline:#85736A; --md-outline-variant:#D7C3B7;
  --md-star:#9C7207;

  --label:var(--md-on-surface);
  --secondary-label:var(--md-on-surface-variant);
  --tertiary-label:var(--md-outline);
  --bg:var(--md-surface);
  --bg-elevated:var(--md-surface-container-low);
  --separator:var(--md-outline-variant);
  --separator-weak:var(--md-outline-variant);
  --fill:var(--md-surface-container-high);
  --fill-2:var(--md-surface-container);
  --tint:var(--md-primary);
  --tint-weak:var(--md-primary-container);
  --on-tint:var(--md-on-primary);
  --red:var(--md-error);
  --green:#2E6B3E;
  --yellow:var(--md-star);
  --star-off:var(--md-outline-variant);
  --focus:var(--md-primary);
  --font-sys:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,-apple-system,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:999px;
  --r-card:var(--r-lg);--r-ctl:var(--r-md);--r-chip:var(--r-full);
}
@media (prefers-color-scheme:dark){
  :root{
    --md-primary:#FFB77C; --md-on-primary:#4A2800;
    --md-primary-container:#6C3A00; --md-on-primary-container:#FFDCC2;
    --md-secondary:#E4BFA8; --md-on-secondary:#422B1B;
    --md-secondary-container:#5B4130; --md-on-secondary-container:#FFDCC2;
    --md-tertiary:#C9CC93; --md-on-tertiary:#31340A;
    --md-tertiary-container:#474A1F; --md-on-tertiary-container:#E5E8AD;
    --md-error:#FFB4AB; --md-on-error:#690005;
    --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
    --md-surface:#19120D; --md-on-surface:#F0E0D5; --md-on-surface-variant:#D7C3B7;
    --md-surface-container-lowest:#130C08; --md-surface-container-low:#211A14;
    --md-surface-container:#261D17; --md-surface-container-high:#312720;
    --md-surface-container-highest:#3C322B;
    --md-outline:#9F8D82; --md-outline-variant:#52443B;
    --md-star:#F4C95D;
    --green:#7CD58F;
  }
}

html,body{height:100%;}
html{background-color:var(--bg);}
body{font-family:var(--font-sys);color:var(--label);background-color:var(--bg);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.5;letter-spacing:.01em;}
.wrap{max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 40px);}

/* グローバル: フォーカスリング & reduced-motion (WCAG 2.4.7 / 2.3) */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
}

/* ===== back link（M3・48dp標的） ===== */
.back{display:inline-flex;align-items:center;gap:3px;
  min-height:48px;padding:4px 4px 4px 0;margin:0 0 2px -2px;
  font-size:15px;font-weight:600;color:var(--md-primary);
  text-decoration:none;letter-spacing:.1px;
  transition:opacity .15s ease;}
.back::before{content:"\2039";font-size:26px;line-height:1;font-weight:500;margin-top:-1px;}
.back:hover{opacity:.7;}
.back:active{opacity:.45;}

/* ===== Headline「トロフィー」（anti-ai: 900ワードマーク） ===== */
.title{font-size:32px;line-height:40px;font-weight:900;color:var(--md-on-surface);
  letter-spacing:-.01em;margin:2px 0 0;}

/* ===== スコア（M3 elevated カード） ===== */
.score-card{background:var(--md-surface-container-low);border-radius:var(--r-lg);
  border:1px solid var(--md-outline-variant);
  padding:16px 16px 18px;margin:16px 0 10px;}
.score{font-size:15px;font-weight:600;color:var(--md-on-surface-variant);
  letter-spacing:.2px;display:flex;align-items:baseline;gap:8px;}
.score #score{font-size:22px;font-weight:700;color:var(--md-on-surface);
  font-variant-numeric:tabular-nums;letter-spacing:0;}
.scorebar{height:10px;border-radius:var(--r-full);background:var(--md-surface-container-high);
  overflow:hidden;margin-top:13px;}
.scorebar i{display:block;height:100%;background:var(--md-primary);
  border-radius:var(--r-full);transition:width .4s var(--ease-decelerate,cubic-bezier(.05,.7,.1,1));}

/* ===== グループ見出し（iOS グループドリスト ヘッダ） ===== */
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--secondary-label);
  text-transform:none;padding:0 8px 7px;margin:26px 0 0;}
.group-h .grp-n{font-size:13px;font-weight:600;color:var(--tertiary-label);
  font-variant-numeric:tabular-nums;}

/* グループ見出しの直後から連続する .tr がインセットグループ（カード）を形成。
   先頭/末尾の角丸は :first-of-type / 直前が .group-h の行で表現する。 */
.tr{position:relative;display:flex;align-items:center;gap:13px;
  background:var(--bg-elevated);
  padding:12px 14px;min-height:60px;
  border-left:1px solid var(--separator-weak);
  border-right:1px solid var(--separator-weak);}
/* 行間の区切り線（iOS インセット: バッジ幅ぶん字下げ） */
.tr::after{content:"";position:absolute;left:65px;right:0;bottom:0;
  height:1px;background:var(--separator-weak);}
/* グループ見出しの直後（=グループ先頭行）: 上角丸＋上境界 */
.group-h + .tr{border-top:1px solid var(--separator-weak);
  border-top-left-radius:var(--r-card);border-top-right-radius:var(--r-card);}
/* グループ末尾行（次が .group-h）/ リスト最終行: 下角丸＋全幅境界・区切り線消す */
.tr:has(+ .group-h),.tr:last-child{
  border-bottom:1px solid var(--separator-weak);
  border-bottom-left-radius:var(--r-card);border-bottom-right-radius:var(--r-card);}
.tr:has(+ .group-h)::after,.tr:last-child::after{display:none;}

/* バッジ: 獲得=tint塗り / 未獲得=淡色アウトライン（色のみ依存しない: ✓ / 🔒 文字併用） */
.tr-badge{width:38px;height:38px;flex-shrink:0;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;font-weight:700;line-height:1;
  background:var(--md-surface-container-high);color:var(--md-on-surface-variant);
  border:1.5px solid var(--md-outline-variant);}
.tr.on .tr-badge{background:var(--md-primary);color:var(--md-on-primary);border-color:var(--md-primary);}

.tr-body{flex:1;min-width:0;}
.tr-title{font-size:17px;font-weight:600;color:var(--secondary-label);
  letter-spacing:.1px;line-height:1.3;}
.tr.on .tr-title{color:var(--label);}
.tr-desc{font-size:13px;color:var(--tertiary-label);margin-top:2px;
  letter-spacing:.1px;line-height:1.35;}

/* 進捗バー: 獲得=tint / 未獲得=淡色 */
.tr-prog{height:6px;border-radius:var(--r-chip);background:var(--fill);
  overflow:hidden;margin-top:9px;}
.tr-prog i{display:block;height:100%;background:var(--tertiary-label);
  border-radius:var(--r-chip);transition:width .4s cubic-bezier(.16,1,.3,1);}
.tr.on .tr-prog i{background:var(--tint);}

/* 右端: 「獲得」=tint文言（色＋文言） / 未獲得=have/target */
.tr-have{flex-shrink:0;font-size:13px;font-weight:600;color:var(--secondary-label);
  min-width:46px;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:.1px;}
.tr.on .tr-have{color:var(--tint);}

/* 空状態（記録なし） */
.empty-note{font-size:15px;color:var(--secondary-label);text-align:center;
  padding:18px 16px 6px;letter-spacing:.2px;line-height:1.6;}

.foot{margin-top:26px;text-align:center;font-size:13px;color:var(--tertiary-label);
  line-height:1.7;letter-spacing:.2px;}

/* アプリ的挙動: 長押しの文字選択を無効 / プルto更新を無効 */
html,body{overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}

/* モーダル/ビューア表示中は背景をロック（スワイプ貫通防止） */
html:has(.mask.on),body:has(.mask.on),html:has(#viewer.on),body:has(#viewer.on){overflow:hidden;}
.sheet{overscroll-behavior:contain;}
.mask{touch-action:none;overscroll-behavior:none;} /* 暗幕もスクロール不可 */

/* ページ間のなめらか遷移（クロスドキュメント View Transitions・未対応は通常遷移） */
@view-transition{ navigation: auto; }
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;}
}

/* ページ間遷移を躍動的に（index と統一） */
::view-transition-old(root){ animation: vtOut 220ms cubic-bezier(.3,0,.8,.15) both; }
::view-transition-new(root){ animation: vtIn 360ms cubic-bezier(.34,1.56,.64,1) both; }
@keyframes vtOut{ to{opacity:0;transform:translateY(-10px) scale(.97);} }
@keyframes vtIn{ from{opacity:0;transform:translateY(16px) scale(1.02);} }
@media (prefers-reduced-motion: reduce){ ::view-transition-old(root),::view-transition-new(root){animation:none!important;} }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">麺帳</a>
  <h1 class="title">トロフィー</h1>
  <div class="score-card">
    <div class="score" aria-live="polite"><span id="score"></span></div>
    <div class="scorebar" role="img" aria-label="トロフィー獲得の進捗"><i id="scorebar"></i></div>
  </div>
  <div id="list"></div>
  <p class="foot">麺を食べて記録すると自動で獲得します</p>
</div>
<script>
const KEY='ramenLog.v1'
function loadRecords(){try{const r=JSON.parse(localStorage.getItem(KEY));if(!r)return[];return Array.isArray(r)?r:(r.records||[])}catch(e){return[]}}
const $=id=>document.getElementById(id)
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

const records=loadRecords()
const ach=(window.computeAchievements?computeAchievements(records):[])
const earnedN=ach.filter(a=>a.earned).length
$('score').textContent=`${earnedN} / ${ach.length} 獲得`
$('scorebar').style.width=ach.length?Math.round(earnedN/ach.length*100)+'%':'0%'

function trItem(a){
  return `<div class="tr ${a.earned?'on':''}">
      <div class="tr-badge" aria-hidden="true">${a.earned?'✓':'🔒'}</div>
      <div class="tr-body">
        <div class="tr-title">${esc(a.title)}</div>
        <div class="tr-desc">${esc(a.desc)}</div>
        <div class="tr-prog"><i style="width:${Math.round(a.pct*100)}%"></i></div>
      </div>
      <div class="tr-have">${a.earned?'獲得':a.have+'/'+a.target}</div>
    </div>`
}
function section(title,items){
  if(!items.length) return ''
  const e=items.filter(a=>a.earned).length
  return `<div class="group-h">${esc(title)} <span class="grp-n">${e}/${items.length}</span></div>`+items.map(trItem).join('')
}
// 総合 → 麺類ごと（各セクションに デビュー/マニア/極み）
const genres=(window.MENCHO_GENRES||[])
let html=section('総合', ach.filter(a=>a.group==='総合'))
genres.forEach(g=>{ html+=section(g, ach.filter(a=>a.id.split(':')[1]===g)) })
// 記録が無くても全トロフィーを一覧表示（目標を眺められる）
$('list').innerHTML = (records.length?'':'<div class="empty-note">まだ記録なし。これが集めるトロフィー一覧です。</div>') + html
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
