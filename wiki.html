<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFFFFF">
<title>麺帳 用語辞典</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--paper:#FFFFFF;--ink:#0B0B0B;--ink-2:#555;--ink-3:#9A9A9A;--line:#E6E6E6;--line-2:#F2F2F2;}
html,body{height:100%;}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);background:var(--paper);
  min-height:100dvh;-webkit-font-smoothing:antialiased;}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 20px 80px;}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);
  text-decoration:none;margin-bottom:20px;}
.title{font-size:26px;font-weight:900;letter-spacing:2px;}
.sub{font-size:12px;color:var(--ink-3);margin-top:6px;line-height:1.7;letter-spacing:.5px;}
.search{width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:11px 14px;font-family:inherit;font-size:14px;color:var(--ink);margin:22px 0 6px;}
.search::placeholder{color:var(--ink-3);}
.search:focus{outline:none;border-color:var(--ink);}
.count{font-size:11px;color:var(--ink-3);margin-bottom:8px;letter-spacing:.5px;}
.group-h{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--paper);background:var(--ink);
  display:inline-block;padding:4px 11px;border-radius:5px;margin:30px 0 6px;}
.term{padding:18px 0;border-bottom:1px solid var(--line);}
.term-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.term-w{font-size:18px;font-weight:900;letter-spacing:.5px;}
.term-r{font-size:12px;color:var(--ink-3);font-weight:600;}
.term-tag{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--paper);background:var(--ink);
  padding:2px 7px;border-radius:4px;}
.term-d{font-size:14px;line-height:1.85;color:var(--ink-2);margin-top:8px;}
.term-d b{color:var(--ink);font-weight:700;}
.none{padding:60px 0;text-align:center;color:var(--ink-3);font-size:14px;}
.foot{margin-top:34px;text-align:center;font-size:11px;color:var(--ink-3);line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 麺帳にもどる</a>
  <div class="title">麺帳 用語辞典</div>
  <div class="sub">麺ジャンルごとの、ちょっとおもしろい言葉あつめ。<br>記録の「タグ」でも使えます。</div>
  <input class="search" id="q" type="text" placeholder="用語を検索" autocomplete="off">
  <div class="count" id="count"></div>
  <div id="list"></div>
  <div class="foot">麺帳 ／ MEN GLOSSARY<br>※ ここに載っている言葉はだいたい非公式です</div>
</div>

<script>
const GROUPS=[
  {g:'共通', items:[
    {w:'MFN', r:'エム・エフ・エヌ', tag:'公式用語', d:'<b>Most Favorite Noodle</b> の略。いちばん多く食べているジャンル＝あなたの“推し麺”。トップに表示される名誉ある称号。'},
    {w:'麺帳', r:'めんちょう', tag:'このアプリ', d:'<b>このアプリ</b>。あなたの麺の記録帳であり、麺人生の年表。'},
    {w:'沼麺', r:'ぬまめん', d:'中毒性が高すぎて何度も通ってしまう、抜け出せない一杯。'},
    {w:'麺ロス', r:'めんロス', d:'食べ終わってしまった後の喪失感。次の一杯までの禁断症状。'},
    {w:'★5殿堂', r:'ごせいでんどう', d:'評価★5をつけた、人生に刻まれる神麺。分析ページの殿堂に並ぶ。'},
    {w:'リピ確', r:'リピかく', d:'「リピート確定」。また絶対に来ると確信した瞬間に成立する。'},
    {w:'隠れ名店', r:'かくれめいてん', d:'まだ世に知られていない、自分だけの当たり店。'},
    {w:'麺デビュー', r:'めんデビュー', d:'初めてのジャンルや新店を、麺帳に初記録すること。'},
    {w:'無限すすり', r:'むげんすすり', d:'いつまでもすすっていられる、終わってほしくない多幸感。'},
    {w:'優勝', r:'ゆうしょう', d:'今日の一杯が最高だった、という最大級の感想。'},
  ]},
  {g:'ラーメン', items:[
    {w:'替玉案件', r:'かえだまあんけん', d:'替玉せずにはいられない、麺が進みすぎる店。'},
    {w:'スープ完飲', r:'スープかんいん', d:'スープを最後の一滴まで飲み干すこと。最大級の賛辞。'},
    {w:'二郎不可避', r:'じろうふかひ', d:'理由もなく無性に二郎系が食べたくなる現象。だいたい深夜に発症。'},
    {w:'背脂マシ', r:'せあぶらマシ', d:'背脂を増し増しに。背徳と幸福は紙一重。'},
    {w:'味玉必須', r:'あじたまひっす', d:'味玉は絶対にトッピングする派の信条。'},
    {w:'ニンニク入れますか', r:'-', d:'二郎系のコール（注文の合言葉）。麺好きの通過儀礼。'},
  ]},
  {g:'つけ麺', items:[
    {w:'あつもり', r:'-', d:'冷たい麺を温め直してもらう“あつ盛り”。冬の正解。'},
    {w:'割りスープ', r:'わりスープ', d:'残った濃厚つけ汁をスープで割って飲み干す締めの儀式。'},
    {w:'麺リフト', r:'めんリフト', d:'太麺を高く持ち上げる、つけ麺映えの基本動作。'},
    {w:'濃厚ドロ系', r:'のうこうドロけい', d:'ドロッと超濃厚な魚介豚骨スープのこと。'},
    {w:'締めの一滴', r:'しめのいってき', d:'割りスープで最後まで楽しみ尽くす美学。'},
  ]},
  {g:'うどん', items:[
    {w:'コシ命', r:'コシいのち', d:'うどんはコシこそ正義、という強い信念。'},
    {w:'釜玉至高', r:'かまたましこう', d:'釜玉うどん最強説。シンプルこそ至高。'},
    {w:'ぶっかけ日和', r:'ぶっかけびより', d:'暑い日はぶっかけ一択になる気候のこと。'},
    {w:'出汁すすり', r:'だしすすり', d:'澄んだ出汁をそのまま味わう至福。'},
    {w:'つるしこ', r:'-', d:'つるつる＆しこしこ。理想ののど越しと食感。'},
  ]},
  {g:'そば', items:[
    {w:'二八派', r:'にはちは', d:'そば粉8：小麦2の二八蕎麦を推す派閥。'},
    {w:'十割勢', r:'じゅうわりぜい', d:'そば粉100%の十割こそ本物、と考える勢力。'},
    {w:'そば湯まで', r:'そばゆまで', d:'〆のそば湯まで飲み干して完結する流儀。'},
    {w:'蕎麦前', r:'そばまえ', d:'そばの前に一杯ひっかける、大人の嗜み。'},
    {w:'ざる至上', r:'ざるしじょう', d:'冷たいざる蕎麦こそ至高、という主張。'},
  ]},
  {g:'パスタ', items:[
    {w:'アルデンテ勢', r:'アルデンテぜい', d:'麺に少し芯を残す固ゆで派。'},
    {w:'追いチーズ', r:'おいチーズ', d:'食べる途中でチーズを追加投入する行為。'},
    {w:'乳化の正義', r:'にゅうかのせいぎ', d:'オイルと茹で汁を乳化させてこそ旨い、という信条。'},
    {w:'ペペ基準', r:'ペペきじゅん', d:'ペペロンチーノで店やシェフの実力を測ること。'},
    {w:'大盛り正義', r:'おおもりせいぎ', d:'パスタは大盛り一択、という揺るがぬ意志。'},
  ]},
  {g:'焼きそば', items:[
    {w:'鉄板の音', r:'てっぱんのおと', d:'ジュージューという音だけで食欲が爆上がりする現象。'},
    {w:'紅生姜マシ', r:'べにしょうがマシ', d:'紅生姜を山盛りにする派。酸味で無限に進む。'},
    {w:'ソース香', r:'ソースか', d:'あの香りだけで白米がいけてしまう罪な匂い。'},
    {w:'屋台の味', r:'やたいのあじ', d:'祭りの記憶とセットの、あの素朴な味。'},
    {w:'麺パリ勢', r:'めんパリぜい', d:'麺を焼き付けてパリッとさせる食感重視派。'},
  ]},
  {g:'担々麺', items:[
    {w:'痺れ追加', r:'しびれついか', d:'花椒（ホアジャオ）の痺れを増し増しに注文すること。'},
    {w:'汁なし派', r:'しるなしは', d:'スープのない汁なし担々麺を推す派閥。'},
    {w:'ゴマ濃厚', r:'ゴマのうこう', d:'ゴマだれが濃いほど良いという好み。'},
    {w:'辛さマシ', r:'からさマシ', d:'辛さレベルを上げる、汗かき覚悟の選択。'},
    {w:'花椒沼', r:'ホアジャオぬま', d:'痺れにハマって抜け出せなくなった状態。'},
  ]},
  {g:'フォー', items:[
    {w:'パクチー増し', r:'パクチーまし', d:'パクチーを大量投入する、香草好きの嗜み。'},
    {w:'ライム搾り', r:'ライムしぼり', d:'途中でライムを搾って味変する定番ムーブ。'},
    {w:'朝フォー', r:'あさフォー', d:'朝に食べる、胃にやさしいあっさりフォー。'},
    {w:'あっさり優勝', r:'あっさりゆうしょう', d:'やさしい味こそ正義、という感想。'},
    {w:'エスニック開拓', r:'エスニックかいたく', d:'新しいエスニック麺を攻めていく探究心。'},
  ]},
]

const $=id=>document.getElementById(id)
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function termHTML(t){
  return `<div class="term"><div class="term-h">
    <span class="term-w">${esc(t.w)}</span>
    ${t.r&&t.r!=='-'?`<span class="term-r">${esc(t.r)}</span>`:''}
    ${t.tag?`<span class="term-tag">${esc(t.tag)}</span>`:''}
  </div><div class="term-d">${t.d}</div></div>`
}
function render(q){
  q=(q||'').toLowerCase()
  let any=0,html=''
  for(const grp of GROUPS){
    const items=grp.items.filter(t=>!q||`${t.w} ${t.r} ${t.d} ${grp.g}`.toLowerCase().includes(q))
    if(!items.length)continue
    any+=items.length
    html+=`<div class="group-h">${esc(grp.g)}</div>`+items.map(termHTML).join('')
  }
  $('count').textContent=`${any} 語`
  $('list').innerHTML=any?html:'<div class="none">見つからなかった…</div>'
}
$('q').oninput=e=>render(e.target.value.trim())
render('')
</script>
</body>
</html>
