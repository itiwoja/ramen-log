<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#D7263D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>麺帳 — 麺類の記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FBF3E7;--bg2:#F3E3C8;
  --ink:#2A1E16;--ink-soft:#7A6A58;--ink-faint:#A8957E;
  --card:#FFFFFF;
  --noren:#D7263D;--noren-dark:#A81C2E;
  --broth:#E8853A;--broth-soft:#F4C77E;
  --nori:#2F3A3A;--menma:#E8C887;--negi:#7BA05B;
  --line:rgba(42,30,22,.08);
  --radius:18px;
}
html,body{height:100%;}
body{
  font-family:'Zen Kaku Gothic New',sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 100% 0%, rgba(232,133,58,.12), transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(215,38,61,.08), transparent 45%),
    linear-gradient(170deg,var(--bg),var(--bg2));
  min-height:100dvh;overflow-x:hidden;
}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px 120px;}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;}
.logo{font-family:'Yuji Syuku',serif;font-size:32px;color:var(--ink);line-height:1;display:flex;align-items:center;gap:8px;}
.logo .bowl{font-family:'Zen Kaku Gothic New';font-size:34px;}
.logo-sub{font-size:11px;color:var(--ink-soft);letter-spacing:3px;margin-top:6px;font-weight:500;}
.gear{width:42px;height:42px;border-radius:50%;border:none;background:var(--card);color:var(--ink-soft);
  font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(42,30,22,.08);}
.gear:active{transform:scale(.94);}
.bk-info{font-size:12px;color:var(--ink-soft);line-height:1.7;background:rgba(232,133,58,.1);
  border-radius:12px;padding:12px 14px;margin-bottom:16px;}
.bk-btn{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:14px;
  padding:15px;font-family:inherit;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer;
  margin-bottom:10px;display:flex;align-items:center;gap:10px;justify-content:center;}
.bk-btn:active{transform:scale(.98);}
.bk-btn .bi{font-size:18px;}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px;}
.stat{background:var(--card);border-radius:14px;padding:11px 6px;text-align:center;
  box-shadow:0 4px 14px rgba(42,30,22,.06);}
.stat .v{font-size:18px;font-weight:900;color:var(--noren);font-family:'Zen Kaku Gothic New';line-height:1;}
.stat .v small{font-size:10px;font-weight:700;}
.stat .l{font-size:9.5px;color:var(--ink-faint);margin-top:5px;font-weight:500;}

/* filter */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;
  background:var(--card);color:var(--ink-soft);border:1.5px solid var(--line);}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);}

/* list */
.list{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;
  box-shadow:0 6px 20px rgba(42,30,22,.08);display:flex;transition:transform .12s;position:relative;}
.card:active{transform:scale(.985);}
.card-photo{width:108px;flex-shrink:0;background:linear-gradient(135deg,var(--broth-soft),var(--broth));
  display:flex;align-items:center;justify-content:center;font-size:40px;object-fit:cover;}
img.card-photo{object-fit:cover;}
.card-body{flex:1;padding:13px 14px;min-width:0;}
.card-shop{font-size:12px;color:var(--ink-soft);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-menu{font-size:16px;font-weight:900;color:var(--ink);margin-top:1px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap;}
.tchip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(232,133,58,.15);color:var(--broth);}
.stars{font-size:13px;color:var(--broth);letter-spacing:1px;}
.stars .off{color:#E3D6C2;}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.card-date{font-size:10.5px;color:var(--ink-faint);}
.card-price{font-size:12px;font-weight:700;color:var(--ink-soft);}

/* empty */
.empty{text-align:center;padding:70px 24px;color:var(--ink-faint);}
.empty .e{font-size:64px;margin-bottom:14px;filter:grayscale(.2);}
.empty .t{font-size:16px;font-weight:700;color:var(--ink-soft);}
.empty .d{font-size:13px;margin-top:8px;line-height:1.7;}

/* FAB */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);
  background:var(--noren);color:#fff;border:none;border-radius:999px;
  padding:15px 30px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 10px 26px rgba(215,38,61,.4);display:flex;align-items:center;gap:8px;z-index:40;}
.fab:active{transform:translateX(-50%) scale(.95);}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(42,30,22,.45);backdrop-filter:blur(2px);
  opacity:0;visibility:hidden;transition:.28s;z-index:50;}
.mask.on{opacity:1;visibility:visible;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:var(--bg);border-radius:26px 26px 0 0;z-index:51;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.16,1,.3,1);
  max-height:92dvh;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 24px);}
.sheet.on{transform:none;}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:12px auto 8px;}
.sheet-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:18px;}

/* photo picker */
.photo-pick{width:100%;height:170px;border-radius:16px;border:2px dashed var(--broth-soft);
  background:rgba(232,133,58,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;cursor:pointer;color:var(--broth);font-weight:700;font-size:13px;overflow:hidden;position:relative;margin-bottom:18px;}
.photo-pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-pick .pp-ico{font-size:34px;}
.photo-clear{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;border:none;
  width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;z-index:2;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field textarea{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;font-family:inherit;font-size:15px;color:var(--ink);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--broth);}
.field textarea{resize:none;min-height:62px;}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}

.type-grid{display:flex;flex-wrap:wrap;gap:8px;}
.type-opt{padding:9px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
  background:var(--card);color:var(--ink-soft);border:1.5px solid var(--line);}
.type-opt.on{background:var(--broth);color:#fff;border-color:var(--broth);}

.star-pick{display:flex;gap:6px;}
.star-pick span{font-size:34px;color:#E3D6C2;cursor:pointer;transition:transform .1s;}
.star-pick span.on{color:var(--broth);}
.star-pick span:active{transform:scale(1.2);}

.save-btn{width:100%;background:var(--noren);color:#fff;border:none;border-radius:14px;
  padding:16px;font-family:inherit;font-size:17px;font-weight:900;cursor:pointer;margin-top:6px;
  box-shadow:0 8px 20px rgba(215,38,61,.3);}
.save-btn:active{transform:scale(.98);}
.del-btn{width:100%;background:transparent;color:var(--noren);border:none;
  padding:14px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:30px;
  opacity:0;transition:.3s;z-index:99;pointer-events:none;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="logo"><span class="bowl">🍜</span>麺帳</div>
      <div class="logo-sub">NOODLE LOG</div>
    </div>
    <button class="gear" id="gear" aria-label="バックアップ">⚙</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="st-count">0</div><div class="l">杯</div></div>
    <div class="stat"><div class="v" id="st-avg">–</div><div class="l">平均評価</div></div>
    <div class="stat"><div class="v" id="st-total">¥0</div><div class="l">合計</div></div>
    <div class="stat"><div class="v" id="st-fav" style="font-size:13px">–</div><div class="l">推し</div></div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="list" id="list"></div>
  <div class="empty hidden" id="empty">
    <div class="e">🍜</div>
    <div class="t">まだ記録がないよ</div>
    <div class="d">食べた麺を記録してみよう。<br>ラーメンもうどんもパスタも、まとめて残せます。</div>
  </div>
</div>

<button class="fab" id="fab">＋ 記録する</button>

<!-- 追加/編集シート -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div class="sheet-title" id="sheet-title">麺を記録</div>

  <div class="photo-pick" id="photoPick">
    <span class="pp-ico">📷</span>
    <span>写真を追加</span>
    <input type="file" accept="image/*" capture="environment" id="photoInput" class="hidden">
  </div>

  <div class="field">
    <label>メニュー名</label>
    <input type="text" id="f-menu" placeholder="肉うどん / 醤油ラーメン / カルボナーラ" maxlength="40">
  </div>
  <div class="field">
    <label>お店</label>
    <input type="text" id="f-shop" placeholder="麺屋 ○○" maxlength="40">
  </div>

  <div class="field">
    <label>種類</label>
    <div class="type-grid" id="typeGrid"></div>
  </div>

  <div class="field">
    <label>評価</label>
    <div class="star-pick" id="starPick">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>
  </div>

  <div class="row2">
    <div class="field"><label>価格</label><input type="number" id="f-price" placeholder="900" inputmode="numeric"></div>
    <div class="field"><label>日付</label><input type="text" id="f-date" placeholder="2026-06-25"></div>
  </div>

  <div class="field">
    <label>ひとことメモ</label>
    <textarea id="f-memo" placeholder="コシが最高だった。出汁がきいてて美味しい。" maxlength="140"></textarea>
  </div>

  <button class="save-btn" id="saveBtn">記録する</button>
  <button class="del-btn hidden" id="delBtn">この記録を削除</button>
</div>

<!-- バックアップ/復元シート -->
<div class="mask" id="bkMask"></div>
<div class="sheet" id="bkSheet">
  <div class="grip"></div>
  <div class="sheet-title">データの管理</div>
  <div class="bk-info">
    📱 記録は<b>この端末の中だけ</b>に保存されています。<br>
    機種変更・ブラウザ削除に備えて、ときどきバックアップを書き出しておくと安心です。
  </div>
  <button class="bk-btn" id="exportBtn"><span class="bi">⬆️</span> バックアップを書き出す</button>
  <button class="bk-btn" id="importBtn"><span class="bi">⬇️</span> バックアップから復元する</button>
  <input type="file" accept="application/json,.json" id="importInput" class="hidden">
</div>

<div id="toast"></div>

<script>
// ===== データ =====
// 保存キーは絶対に変えない (変えると既存データが読めなくなる)。
// 構造を変える時は migrate() に移行処理を足す。破壊的変更はしない。
const KEY='ramenLog.v1'
const DATA_VERSION=1
const TYPES=['ラーメン','つけ麺','うどん','そば','パスタ','焼きそば','担々麺','フォー','その他']
const TYPE_EMOJI={'ラーメン':'🍜','つけ麺':'🥡','うどん':'🍲','そば':'🥢','パスタ':'🍝','焼きそば':'🍳','担々麺':'🌶️','フォー':'🍤','その他':'🍴'}

let records=load()
let filter='すべて'
let editId=null
let formPhoto=null
let formType=null
let formStars=0

// 読み込み: 旧形式(配列) / 新形式({version,records}) どちらも受ける = 更新でデータを失わない
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY))
    if(!raw) return []
    const arr=Array.isArray(raw)?raw:(raw.records||[])
    return migrate(arr)
  }catch(e){return []}
}
// 各レコードに不足フィールドを補う(将来の構造変更にも壊れない)
function migrate(arr){
  return arr.filter(Boolean).map(r=>({
    id:r.id||uid(), menu:r.menu||'', shop:r.shop||'',
    type:r.type||null, stars:r.stars||0,
    price:r.price||'', date:r.date||'', memo:r.memo||'', photo:r.photo||null,
  }))
}
function save(){
  // 新形式で保存 (バージョン付き)。配列としても読めるよう records に格納。
  localStorage.setItem(KEY,JSON.stringify({version:DATA_VERSION,records,savedAt:new Date().toISOString()}))
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

const $=id=>document.getElementById(id)

// ===== 描画 =====
function starHTML(n){let s='';for(let i=1;i<=5;i++)s+=`<span class="${i<=n?'':'off'}">★</span>`;return `<span class="stars">${s}</span>`}

function render(){
  // stats
  $('st-count').textContent=records.length
  const avg=records.length?(records.reduce((a,r)=>a+(r.stars||0),0)/records.length):0
  $('st-avg').innerHTML=records.length?avg.toFixed(1)+'<small>★</small>':'–'
  const total=records.reduce((a,r)=>a+(Number(r.price)||0),0)
  $('st-total').innerHTML='¥'+total.toLocaleString()
  // fav type
  if(records.length){
    const c={};records.forEach(r=>{if(r.type)c[r.type]=(c[r.type]||0)+1})
    const fav=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]
    $('st-fav').textContent=fav?fav[0]:'–'
  }else $('st-fav').textContent='–'

  // filters
  const present=[...new Set(records.map(r=>r.type).filter(Boolean))]
  const fopts=['すべて',...present]
  $('filters').innerHTML=fopts.map(f=>`<div class="fchip ${f===filter?'on':''}" data-f="${f}">${f==='すべて'?'すべて':TYPE_EMOJI[f]+' '+f}</div>`).join('')
  $('filters').querySelectorAll('.fchip').forEach(el=>el.onclick=()=>{filter=el.dataset.f;render()})

  // list
  const items=records.filter(r=>filter==='すべて'||r.type===filter)
  if(records.length===0){$('empty').classList.remove('hidden');$('list').innerHTML='';return}
  $('empty').classList.add('hidden')
  $('list').innerHTML=items.map(r=>`
    <div class="card" data-id="${r.id}">
      ${r.photo?`<img class="card-photo" src="${r.photo}">`:`<div class="card-photo">${TYPE_EMOJI[r.type]||'🍜'}</div>`}
      <div class="card-body">
        <div class="card-shop">${esc(r.shop)||'お店未設定'}</div>
        <div class="card-menu">${esc(r.menu)||'（無題）'}</div>
        <div class="card-meta">
          ${r.type?`<span class="tchip">${TYPE_EMOJI[r.type]||''} ${r.type}</span>`:''}
          ${r.stars?starHTML(r.stars):''}
        </div>
        <div class="card-foot">
          <span class="card-date">${r.date||''}</span>
          ${r.price?`<span class="card-price">¥${Number(r.price).toLocaleString()}</span>`:''}
        </div>
      </div>
    </div>`).join('')
  $('list').querySelectorAll('.card').forEach(el=>el.onclick=()=>openEdit(el.dataset.id))
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

// ===== 種類グリッド =====
$('typeGrid').innerHTML=TYPES.map(t=>`<div class="type-opt" data-t="${t}">${TYPE_EMOJI[t]} ${t}</div>`).join('')
$('typeGrid').querySelectorAll('.type-opt').forEach(el=>el.onclick=()=>{
  formType=el.dataset.t
  $('typeGrid').querySelectorAll('.type-opt').forEach(x=>x.classList.toggle('on',x.dataset.t===formType))
})

// ===== 星 =====
$('starPick').querySelectorAll('span').forEach(el=>el.onclick=()=>{
  formStars=+el.dataset.v
  paintStars()
})
function paintStars(){$('starPick').querySelectorAll('span').forEach(s=>s.classList.toggle('on',+s.dataset.v<=formStars))}

// ===== 写真 (リサイズして保存) =====
$('photoPick').onclick=()=>$('photoInput').click()
$('photoInput').onchange=e=>{
  const file=e.target.files[0];if(!file)return
  const reader=new FileReader()
  reader.onload=ev=>{
    const img=new Image()
    img.onload=()=>{
      const max=900,scale=Math.min(1,max/Math.max(img.width,img.height))
      const cv=document.createElement('canvas')
      cv.width=img.width*scale;cv.height=img.height*scale
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height)
      formPhoto=cv.toDataURL('image/jpeg',0.8)
      paintPhoto()
    }
    img.src=ev.target.result
  }
  reader.readAsDataURL(file)
}
function paintPhoto(){
  if(formPhoto){
    $('photoPick').innerHTML=`<img src="${formPhoto}"><button class="photo-clear" id="pc">✕</button>`
    $('pc').onclick=ev=>{ev.stopPropagation();formPhoto=null;resetPhotoUI()}
  }else resetPhotoUI()
}
function resetPhotoUI(){
  $('photoPick').innerHTML=`<span class="pp-ico">📷</span><span>写真を追加</span><input type="file" accept="image/*" capture="environment" id="photoInput" class="hidden">`
  $('photoInput').onchange=window._onPhoto
}
window._onPhoto=$('photoInput').onchange

// ===== シート操作 =====
function openAdd(){
  editId=null;formPhoto=null;formType=null;formStars=0
  $('sheet-title').textContent='麺を記録'
  $('f-menu').value='';$('f-shop').value='';$('f-price').value='';$('f-memo').value=''
  $('f-date').value=todayStr()
  $('typeGrid').querySelectorAll('.type-opt').forEach(x=>x.classList.remove('on'))
  paintStars();resetPhotoUI()
  $('delBtn').classList.add('hidden')
  $('saveBtn').textContent='記録する'
  showSheet()
}
function openEdit(id){
  const r=records.find(x=>x.id===id);if(!r)return
  editId=id;formPhoto=r.photo||null;formType=r.type||null;formStars=r.stars||0
  $('sheet-title').textContent='記録を編集'
  $('f-menu').value=r.menu||'';$('f-shop').value=r.shop||''
  $('f-price').value=r.price||'';$('f-memo').value=r.memo||'';$('f-date').value=r.date||todayStr()
  $('typeGrid').querySelectorAll('.type-opt').forEach(x=>x.classList.toggle('on',x.dataset.t===formType))
  paintStars();paintPhoto()
  $('delBtn').classList.remove('hidden')
  $('saveBtn').textContent='更新する'
  showSheet()
}
function showSheet(){$('mask').classList.add('on');$('sheet').classList.add('on')}
function hideSheet(){$('mask').classList.remove('on');$('sheet').classList.remove('on')}
$('mask').onclick=hideSheet
$('fab').onclick=openAdd

$('saveBtn').onclick=()=>{
  const menu=$('f-menu').value.trim()
  if(!menu){toast('メニュー名を入れてね');$('f-menu').focus();return}
  const rec={
    id:editId||uid(),
    menu, shop:$('f-shop').value.trim(),
    type:formType, stars:formStars,
    price:$('f-price').value.trim(), date:$('f-date').value.trim()||todayStr(),
    memo:$('f-memo').value.trim(), photo:formPhoto,
  }
  if(editId){records=records.map(r=>r.id===editId?rec:r);toast('更新したよ ✓')}
  else{records.unshift(rec);toast('記録したよ 🍜')}
  try{save()}catch(e){toast('保存容量オーバー（写真が大きすぎ）')}
  hideSheet();render()
}
$('delBtn').onclick=()=>{
  if(!editId)return
  records=records.filter(r=>r.id!==editId);save();hideSheet();render();toast('削除したよ')
}

function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

// ===== バックアップ / 復元 =====
$('gear').onclick=()=>{$('bkMask').classList.add('on');$('bkSheet').classList.add('on')}
$('bkMask').onclick=()=>{$('bkMask').classList.remove('on');$('bkSheet').classList.remove('on')}

$('exportBtn').onclick=()=>{
  const data={app:'mencho',version:DATA_VERSION,exportedAt:new Date().toISOString(),records}
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'})
  const url=URL.createObjectURL(blob)
  const a=document.createElement('a')
  a.href=url;a.download=`ramen-log-backup-${todayStr()}.json`
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)
  toast('バックアップを書き出したよ 💾')
}

$('importBtn').onclick=()=>$('importInput').click()
$('importInput').onchange=e=>{
  const file=e.target.files[0];if(!file)return
  const reader=new FileReader()
  reader.onload=ev=>{
    try{
      const parsed=JSON.parse(ev.target.result)
      const incoming=migrate(Array.isArray(parsed)?parsed:(parsed.records||[]))
      if(!incoming.length){toast('読み込めるデータが無かったよ');return}
      // 既存とマージ (id が同じものは復元データで上書き、新規は追加。既存の他データは消さない)
      const byId={}
      records.forEach(r=>byId[r.id]=r)
      incoming.forEach(r=>byId[r.id]=r)
      records=Object.values(byId)
      save();render()
      $('bkMask').classList.remove('on');$('bkSheet').classList.remove('on')
      toast(`${incoming.length}件を復元したよ ✓`)
    }catch(err){toast('ファイルを読めなかった…')}
    finally{e.target.value=''}
  }
  reader.readAsText(file)
}

let tT=null
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1800)}

render()
</script>
</body>
</html>
