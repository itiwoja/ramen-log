<title>麺帳 — 麺類の記録</title>
<style>
/* ============================================================
   麺帳 — Apple HIG (iOS) reskin
   Clarity / Deference / Depth。料理写真が主役、UIは控えめ。
   セマンティック色トークン（Light/Dark）。tint=醤油の琥珀。
   JS・id・データキーは一切変更していない（見た目層のみ）。
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  /* --- HIG セマンティックカラー（Light） --- */
  --label:#1C1C1E;
  --secondary-label:rgba(60,60,67,.6);
  --tertiary-label:rgba(60,60,67,.45);
  --bg:#F2F2F7;            /* 純白回避 */
  --bg-elevated:#FFFFFF;
  --separator:rgba(60,60,67,.29);
  --separator-weak:rgba(60,60,67,.14);
  --fill:rgba(118,118,128,.12);     /* tertiary system fill 相当 */
  --fill-2:rgba(118,118,128,.08);
  --tint:#B85C1E;                    /* 醤油の琥珀（systemBlueの代わり） */
  --tint-weak:rgba(184,92,30,.12);
  --on-tint:#FFFFFF;
  --red:#FF3B30;
  --green:#34C759;
  --yellow:#FFB300;                  /* ★評価 */
  --star-off:rgba(60,60,67,.22);
  --focus:#B85C1E;
  --font-sys:-apple-system,"SF Pro Text","SF Pro Display","Hiragino Kaku Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --r-card:14px;--r-sheet:14px;--r-ctl:12px;--r-chip:999px;
  /* --- モーション・トークン（motion-design）transform/opacityのみ駆動 --- */
  --ease-standard:cubic-bezier(.2,0,0,1);
  --ease-decelerate:cubic-bezier(.05,.7,.1,1);   /* 出現 */
  --ease-accelerate:cubic-bezier(.3,0,.8,.15);   /* 退出 */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);    /* 弾むスプリング感 */
  --dur-fast:140ms;--dur:240ms;--dur-slow:380ms;
}
@media (prefers-color-scheme:dark){
  :root{
    --label:#FFFFFF;
    --secondary-label:rgba(235,235,245,.6);
    --tertiary-label:rgba(235,235,245,.45);
    --bg:#000000;                    /* iOS標準として可 */
    --bg-elevated:#1C1C1E;
    --separator:rgba(84,84,88,.65);
    --separator-weak:rgba(84,84,88,.4);
    --fill:rgba(118,118,128,.24);
    --fill-2:rgba(118,118,128,.16);
    --tint:#F0A35E;
    --tint-weak:rgba(240,163,94,.18);
    --on-tint:#1C1C1E;
    --red:#FF453A;
    --green:#30D158;
    --yellow:#FFD426;
    --star-off:rgba(235,235,245,.25);
    --focus:#F0A35E;
  }
}

html,body{height:100%;}
body{font-family:var(--font-sys);color:var(--label);background-color:var(--bg);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  font-size:17px;line-height:1.45;}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 116px);}

/* グローバル: フォーカスリング & reduced-motion (WCAG 2.4.7 / 2.3) */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
}

/* ===== header: Large Title「麺帳」（ワードマーク・絵文字なし） ===== */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  margin:8px 0 18px;}
.logo-word{font-size:34px;line-height:41px;font-weight:700;color:var(--label);letter-spacing:.4px;}
.logo-sub{font-size:13px;color:var(--secondary-label);letter-spacing:.3px;margin-top:2px;font-weight:400;}
.head-actions{display:flex;gap:6px;flex-shrink:0;}
.gear{min-width:44px;min-height:44px;width:44px;height:44px;border-radius:50%;
  border:none;background:var(--fill);color:var(--tint);font-size:17px;font-weight:600;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;
  transition:background .15s ease,transform .1s ease;}
.gear:hover{background:var(--fill-2);}
.gear:active{transform:scale(.92);background:var(--tint-weak);}

/* ===== stats: インセットグループ風カード ===== */
.stats{display:flex;background:var(--bg-elevated);border-radius:var(--r-card);
  overflow:hidden;margin-bottom:20px;box-shadow:0 1px 2px rgba(0,0,0,.04);}
.stat{flex:1;padding:14px 4px;text-align:center;position:relative;}
.stat + .stat::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--separator-weak);}
.stat .v{font-size:22px;font-weight:700;color:var(--label);line-height:1.1;font-variant-numeric:tabular-nums;}
.stat .v small{font-size:13px;font-weight:600;color:var(--secondary-label);margin-left:1px;}
.stat .l{font-size:12px;color:var(--secondary-label);margin-top:6px;font-weight:400;letter-spacing:.2px;}

/* ストリーク: tint-weak の控えめバー */
.streak-line{display:none;text-align:center;font-size:15px;font-weight:600;color:var(--tint);
  background:var(--tint-weak);border-radius:var(--r-ctl);padding:12px;margin-bottom:16px;letter-spacing:.2px;}

/* ===== filter / tag: iOS tinted chip ===== */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.filters::-webkit-scrollbar{display:none;}
.fchip{flex-shrink:0;min-height:34px;padding:7px 15px;border-radius:var(--r-chip);
  font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;
  background:var(--fill);color:var(--label);border:none;transition:background .15s ease,transform .1s ease;}
.fchip:active{transform:scale(.95);}
.fchip.on{background:var(--tint);color:var(--on-tint);}
.fchip.tag{font-size:14px;color:var(--secondary-label);}
.fchip.tag.on{background:var(--tint);color:var(--on-tint);}
#tagFilters{margin-top:-4px;}
#tagFilters:empty{display:none;}

/* タグのバッジ */
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tagb{font-size:12px;font-weight:500;color:var(--secondary-label);background:var(--fill);border-radius:7px;padding:3px 8px;}
.d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}

/* ===== list: 写真主役のカード（bg-elevated・薄い境界・角丸） ===== */
.list{display:flex;flex-direction:column;gap:12px;}
.list-hint{font-size:13px;color:var(--tertiary-label);text-align:center;margin-bottom:12px;letter-spacing:.2px;}
/* 検索/フィルタ結果0件の親切な空状態（条件クリア導線つき） */
.no-result{text-align:center;padding:48px 24px;}
.no-result .nr-t{font-size:16px;font-weight:600;color:var(--secondary-label);}
.no-result .nr-d{font-size:14px;color:var(--tertiary-label);margin-top:8px;line-height:1.6;}
.nr-clear{margin-top:18px;background:var(--fill);color:var(--tint);border:none;border-radius:var(--r-chip);
  padding:10px 20px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;min-height:44px;
  transition:background var(--dur-fast) var(--ease-standard),transform var(--dur-fast) var(--ease-spring);}
.nr-clear:hover{background:var(--tint-weak);}
.nr-clear:active{transform:scale(.92);background:var(--tint-weak);}
.card-wrap{position:relative;border-radius:var(--r-card);overflow:hidden;}
/* 2段階スワイプ削除: 露出ボタンは iOS赤(destructive) */
.card-del{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;cursor:pointer;
  padding-right:24px;background:var(--red);color:#fff;font-weight:600;font-size:15px;letter-spacing:.3px;border-radius:var(--r-card);}
.card{display:flex;background:var(--bg-elevated);border:1px solid var(--separator-weak);border-radius:var(--r-card);
  overflow:hidden;cursor:pointer;position:relative;touch-action:pan-y;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:transform .18s ease, opacity .16s ease;}
.card:active{transform:translateX(0) scale(.99);}
.card-photo{width:104px;flex-shrink:0;align-self:stretch;object-fit:cover;min-height:112px;position:relative;}
.card-photo.ph{background:var(--fill);display:flex;align-items:center;justify-content:center;}
.photo-n{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;
  font-weight:600;padding:2px 7px;border-radius:8px;font-style:normal;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.card-photo.ph span{font-size:13px;color:var(--tertiary-label);font-weight:500;letter-spacing:.3px;}
.card-body{flex:1;padding:13px 15px;min-width:0;display:flex;flex-direction:column;}
.card-shop{font-size:15px;color:var(--secondary-label);font-weight:400;letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-menu{font-size:17px;font-weight:600;color:var(--label);margin-top:1px;line-height:1.3;letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-meta{display:flex;align-items:center;gap:10px;margin-top:8px;}
.tchip{font-size:13px;font-weight:500;color:var(--tint);background:var(--tint-weak);border:none;
  padding:3px 9px;border-radius:8px;letter-spacing:.2px;}
.stars{font-size:14px;color:var(--yellow);letter-spacing:1px;}
.stars .off{color:var(--star-off);}
.card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;}
.card-date{font-size:13px;color:var(--tertiary-label);letter-spacing:.1px;font-variant-numeric:tabular-nums;}
.card-price{font-size:15px;font-weight:600;color:var(--secondary-label);font-variant-numeric:tabular-nums;}

/* ===== empty: ワードマーク的に静かに ===== */
.empty{text-align:center;padding:96px 24px;color:var(--tertiary-label);}
.empty .e{font-size:34px;font-weight:700;color:var(--separator);letter-spacing:2px;margin-bottom:16px;}
.empty .t{font-size:17px;font-weight:600;color:var(--secondary-label);}
.empty .d{font-size:15px;margin-top:10px;line-height:1.7;color:var(--tertiary-label);}
/* 空状態のオンボーディングCTA（FABと同じ openAdd を呼ぶ・先にやってみるを促す） */
.empty-cta{margin-top:26px;background:var(--tint);color:var(--on-tint);border:none;border-radius:var(--r-chip);
  padding:14px 26px;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.2px;cursor:pointer;min-height:50px;
  box-shadow:0 6px 20px rgba(184,92,30,.32);
  transition:transform var(--dur-fast) var(--ease-spring),box-shadow var(--dur) var(--ease-standard);}
.empty-cta:hover{box-shadow:0 8px 24px rgba(184,92,30,.4);}
.empty-cta:active{transform:scale(.92);}

/* ===== FAB「＋記録する」: tint塗りの prominent ボタン ===== */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);
  min-height:50px;background:var(--tint);color:var(--on-tint);border:none;border-radius:var(--r-chip);
  padding:14px 28px;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.2px;cursor:pointer;
  box-shadow:0 6px 20px rgba(184,92,30,.32);z-index:40;
  transition:transform .12s ease, box-shadow .15s ease;}
.fab:hover{box-shadow:0 8px 24px rgba(184,92,30,.4);}
.fab:active{transform:translateX(-50%) scale(.96);}

/* ===== sheet: iOS ボトムシート（角丸上部・グリップ・bg-elevated） ===== */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;visibility:hidden;transition:.26s;z-index:50;}
.mask.on{opacity:1;visibility:visible;}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--bg-elevated);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;z-index:51;transform:translateY(100%);
  transition:transform var(--dur-slow) var(--ease-spring);max-height:92dvh;overflow-y:auto;
  padding:0 20px calc(env(safe-area-inset-bottom) + 24px);
  box-shadow:0 -8px 40px rgba(0,0,0,.18);}
.sheet.on{transform:none;}
.grip{width:36px;height:5px;border-radius:3px;background:var(--separator);margin:8px auto 6px;}
.sheet-title{font-size:22px;font-weight:700;letter-spacing:.2px;margin:8px 0 22px;color:var(--label);}

/* photo picker */
.photo-pick{width:100%;min-height:120px;border-radius:var(--r-ctl);
  background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:14px;margin-bottom:22px;}
.photo-strip{display:flex;gap:8px;width:100%;overflow-x:auto;scrollbar-width:none;}
.photo-strip::-webkit-scrollbar{display:none;}
.ps-thumb{flex:0 0 auto;width:78px;height:78px;border-radius:10px;position:relative;
  background:var(--separator-weak) center/cover no-repeat;}
.ps-x{position:absolute;top:-7px;right:-7px;min-width:24px;min-height:24px;width:24px;height:24px;border-radius:50%;border:2px solid var(--bg-elevated);
  background:var(--red);color:#fff;font-size:12px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;
  transition:transform var(--dur-fast) var(--ease-spring);}
.ps-x:active{transform:scale(.85);}
.pp-empty{display:flex;gap:12px;}
.pp-opt{background:var(--bg-elevated);border:1px solid var(--separator-weak);border-radius:var(--r-ctl);
  padding:14px 22px;font-family:inherit;font-size:15px;font-weight:500;color:var(--tint);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;min-width:100px;min-height:44px;
  transition:background .15s ease,transform .1s ease;}
.pp-opt:active{background:var(--fill);transform:scale(.97);}
.pp-ico{font-size:24px;}
.photo-clear{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border:none;
  min-width:28px;min-height:28px;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer;z-index:2;}

/* ===== fields: iOS グループ風 / 大きめ入力 ===== */
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--secondary-label);
  margin-bottom:8px;letter-spacing:.1px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{
  width:100%;background:var(--fill);border:1px solid transparent;border-radius:var(--r-ctl);
  padding:12px 14px;font-family:inherit;font-size:17px;color:var(--label);min-height:44px;
  transition:border-color .15s ease,background .15s ease;}
.field input::placeholder,.field textarea::placeholder{color:var(--tertiary-label);}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--tint);background:var(--bg-elevated);}
.field input:focus-visible,.field textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px;}
.field textarea{resize:none;min-height:64px;line-height:1.5;}
/* 邪魔しないバリデーション: 入力途中では怒らず、確定(フォーカスアウト)後に枠を赤く。 */
.field input:user-invalid{border-color:var(--red);}
.field input[aria-invalid="true"]{border-color:var(--red);}
/* インラインエラー(該当欄のすぐ下)。行高を確保しレイアウトシフトを抑える。 */
.field-err{min-height:18px;margin-top:6px;font-size:13px;font-weight:500;color:var(--red);
  letter-spacing:.1px;opacity:0;transition:opacity var(--dur-fast) var(--ease-standard);}
.field-err.on{opacity:1;}
@media (prefers-reduced-motion:reduce){.field-err{transition:none;}}
.row2{display:flex;gap:14px;}
.row2 .field{flex:1;}

/* 店名検索 (OSM) */
.shop-row{display:flex;gap:10px;align-items:stretch;}
.shop-row input{flex:1;width:auto;}
.shop-find{flex-shrink:0;border:none;background:var(--fill);border-radius:var(--r-ctl);
  padding:0 18px;min-height:44px;font-family:inherit;font-size:15px;font-weight:600;color:var(--tint);cursor:pointer;
  transition:background .15s ease,transform .1s ease;}
.shop-find:active{background:var(--tint-weak);transform:scale(.97);}
.shop-results{display:none;flex-direction:column;background:var(--bg-elevated);border:1px solid var(--separator-weak);border-radius:var(--r-ctl);overflow:hidden;margin-top:10px;}
.shop-results.on{display:flex;}
.sr-item{padding:12px 14px;border-bottom:1px solid var(--separator-weak);cursor:pointer;min-height:44px;transition:background .12s ease;}
.sr-item:last-child{border-bottom:none;}
.sr-item:active{background:var(--fill);}
.sr-name{font-size:16px;font-weight:500;color:var(--label);}
.sr-addr{font-size:13px;color:var(--tertiary-label);margin-top:2px;}
.shop-loc{display:none;font-size:13px;color:var(--secondary-label);font-weight:500;margin-top:8px;}
.shop-loc.on{display:block;}

.word-hint{font-size:13px;color:var(--tertiary-label);margin-top:8px;font-weight:400;letter-spacing:.1px;}
.word-hint a{color:var(--tint);text-decoration:none;}
.word-hint a:hover{text-decoration:underline;}
.word-chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:none;}
.word-chips::-webkit-scrollbar{display:none;}
.wchip{flex-shrink:0;border:none;border-radius:var(--r-chip);padding:8px 14px;min-height:36px;
  font-size:14px;font-weight:500;color:var(--label);background:var(--fill);cursor:pointer;white-space:nowrap;font-family:inherit;
  transition:background .15s ease,transform .1s ease;}
.wchip:active{transform:scale(.95);}
.wchip.on{background:var(--tint);color:var(--on-tint);}

.type-grid{display:flex;flex-wrap:wrap;gap:8px;}
.type-opt{padding:9px 16px;min-height:40px;border-radius:var(--r-chip);font-size:15px;font-weight:500;cursor:pointer;
  display:inline-flex;align-items:center;background:var(--fill);color:var(--label);border:none;
  transition:background .15s ease,transform .1s ease;}
.type-opt:active{transform:scale(.95);}
.type-opt.on{background:var(--tint);color:var(--on-tint);}

.star-pick{display:flex;gap:6px;}
.star-pick span{font-size:36px;line-height:1;color:var(--star-off);cursor:pointer;
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;transition:transform .1s;}
.star-pick span.on{color:var(--yellow);}
.star-pick span:active{transform:scale(1.18);}

.save-btn{width:100%;background:var(--tint);color:var(--on-tint);border:none;border-radius:var(--r-ctl);
  padding:16px;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.2px;cursor:pointer;margin-top:8px;min-height:50px;
  transition:transform .1s ease,opacity .15s ease;}
.save-btn:active{transform:scale(.98);opacity:.92;}
.save-btn:disabled{opacity:.55;cursor:default;transform:none;}
.del-btn{width:100%;background:transparent;color:var(--red);border:none;
  padding:14px;font-family:inherit;font-size:15px;font-weight:400;cursor:pointer;margin-top:6px;min-height:44px;}
.del-btn:active{opacity:.6;}

/* backup */
.store-status{margin-top:10px;font-size:13px;font-weight:500;color:var(--label);}
.bk-info{font-size:14px;color:var(--secondary-label);line-height:1.7;background:var(--fill);
  border-radius:var(--r-ctl);padding:14px 16px;margin-bottom:18px;}
.bk-info b{color:var(--label);font-weight:600;}
.bk-btn{width:100%;border:none;background:var(--fill);border-radius:var(--r-ctl);
  padding:15px;font-family:inherit;font-size:16px;font-weight:500;color:var(--tint);cursor:pointer;min-height:50px;
  margin-bottom:10px;display:flex;align-items:center;gap:10px;justify-content:center;letter-spacing:.1px;
  transition:background .15s ease,transform .1s ease;}
.bk-btn:active{background:var(--tint-weak);transform:scale(.99);}
.bk-btn .bi{font-size:17px;}

/* toolbar: 検索 + 並び替え */
.toolbar{display:flex;gap:8px;margin-bottom:14px;}
.search{flex:1;min-width:0;background:var(--fill);border:1px solid transparent;border-radius:var(--r-ctl);
  padding:10px 14px;font-family:inherit;font-size:17px;color:var(--label);min-height:44px;
  transition:border-color .15s ease,background .15s ease;}
.search::placeholder{color:var(--tertiary-label);}
.search:focus{outline:none;border-color:var(--tint);background:var(--bg-elevated);}
.sort{flex-shrink:0;border:none;border-radius:var(--r-ctl);background:var(--fill);
  padding:0 10px;min-height:44px;font-family:inherit;font-size:15px;font-weight:500;color:var(--tint);cursor:pointer;}
.sort:focus{outline:none;}
/* キーボードフォーカスは必ず可視化（WCAG 2.4.7）。マウス/タッチの :focus 抑制は維持 */
.search:focus-visible,.sort:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

/* 詳細シート */
.d-photo{width:100%;height:230px;border-radius:var(--r-card);overflow:hidden;background:var(--fill);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.d-photo img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;}
.d-photo .ph{font-size:15px;color:var(--tertiary-label);font-weight:500;letter-spacing:.3px;}
.d-gallery{display:flex;gap:10px;overflow-x:auto;margin-bottom:18px;scrollbar-width:none;}
.d-gallery::-webkit-scrollbar{display:none;}
.d-shot{flex:0 0 auto;width:80%;height:230px;border-radius:var(--r-card);background:var(--fill) center/cover no-repeat;cursor:zoom-in;}
.d-shop{font-size:15px;color:var(--secondary-label);font-weight:400;letter-spacing:.1px;}
.d-shop-link{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tint);
  background:var(--tint-weak);border:none;border-radius:var(--r-ctl);padding:9px 14px;min-height:44px;font-weight:500;
  transition:background .15s ease;}
.d-shop-link:active{background:var(--tint);color:var(--on-tint);}
.d-shop-link:active .map-go{color:rgba(255,255,255,.8);}
.d-shop-link .map-go{color:var(--tint);font-weight:400;font-size:13px;opacity:.7;}
.d-menu{font-size:28px;font-weight:700;color:var(--label);margin-top:6px;line-height:1.2;letter-spacing:.2px;}
.d-meta{display:flex;align-items:center;gap:10px;margin-top:14px;}
.d-sub{font-size:15px;color:var(--secondary-label);margin-top:13px;font-weight:400;font-variant-numeric:tabular-nums;}
.d-memo{font-size:17px;color:var(--label);line-height:1.7;margin-top:18px;
  padding-top:18px;border-top:1px solid var(--separator-weak);white-space:pre-wrap;}
.d-actions{display:flex;gap:10px;margin-top:24px;}
.d-edit{flex:1;background:var(--tint);color:var(--on-tint);border:none;border-radius:var(--r-ctl);
  padding:15px;font-family:inherit;font-size:17px;font-weight:600;letter-spacing:.2px;cursor:pointer;min-height:50px;
  transition:transform .1s ease,opacity .15s ease;}
.d-edit:active{transform:scale(.98);opacity:.92;}
.d-del2{flex-shrink:0;padding:15px 20px;background:var(--fill);color:var(--red);
  border:none;border-radius:var(--r-ctl);font-family:inherit;font-size:16px;font-weight:500;cursor:pointer;min-height:50px;
  transition:background .15s ease;}
.d-del2:active{background:var(--tint-weak);}

/* toast: aria-live で読み上げ（マークアップ側に role/aria-live を付与） */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translateX(-50%) translateY(20px);
  background:rgba(28,28,30,.92);color:#fff;font-size:15px;font-weight:500;padding:12px 22px;border-radius:var(--r-ctl);
  opacity:0;transition:.3s;z-index:99;pointer-events:none;letter-spacing:.1px;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);max-width:88vw;text-align:center;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
@media (prefers-color-scheme:dark){#toast{background:rgba(58,58,60,.92);}}

#celebrate{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden;}
.cele{position:absolute;bottom:42%;animation:celePop 1.1s ease-out forwards;}
@keyframes celePop{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-180px) scale(1.15) rotate(var(--rot))}}

#viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:200;display:none;align-items:center;justify-content:center;touch-action:none;}
#viewer.on{display:flex;}
#viewerImg{max-width:100%;max-height:100%;transform-origin:center center;will-change:transform;}
#viewerClose{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:16px;min-width:44px;min-height:44px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(118,118,128,.4);color:#fff;font-size:18px;cursor:pointer;z-index:2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform var(--dur-fast) var(--ease-spring);}
#viewerClose:active{transform:scale(.88);}
.hidden{display:none!important;}

/* スクリーンリーダー専用 */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* アプリ的挙動: 長押しの文字選択を無効 / プルto更新を無効 */
html,body{overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}

/* モーダル/ビューア表示中は背景をロック（スワイプ貫通防止） */
html:has(.mask.on),body:has(.mask.on),html:has(#viewer.on),body:has(#viewer.on){overflow:hidden;}
.sheet{overscroll-behavior:contain;}
.mask{touch-action:none;overscroll-behavior:none;} /* 暗幕もスクロール不可 */

/* ===== モーション層（motion-design / Phase3 強化）=====
   触感のスプリング化と出現アニメをよりダイナミックに。transform/opacity のみ駆動。
   既存の reduced-motion ブロック(上部)が animation/transition を無効化するため自動でオフになる。
   will-change は付けっぱなしにしない（押下/出現の一過性のみ）。 */
/* 押下のスプリング感（タップ標的サイズ=44px は不変・scale だけ変える） */
.fchip,.wchip,.type-opt,.pp-opt,.shop-find,.gear,.save-btn,.del-btn,.d-edit,.bk-btn,.fab,.card{
  transition:transform var(--dur-fast) var(--ease-spring),
             background var(--dur-fast) var(--ease-standard),
             opacity var(--dur-fast) var(--ease-standard),
             box-shadow var(--dur) var(--ease-standard);
}
/* 押下を強める: scale(.92)。戻り(:active 解除)で --ease-spring により軽いオーバーシュート感 */
.fchip:active,.wchip:active,.type-opt:active,.pp-opt:active,.shop-find:active,
.gear:active,.save-btn:active,.del-btn:active,.d-edit:active,.bk-btn:active,.card:active{transform:scale(.92);}

/* リスト項目の躍動的な出現（opacity / translateY / scale + spring + stagger 上限8件） */
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.list .card-wrap{animation:cardIn var(--dur) var(--ease-spring) both;}
.list .card-wrap:nth-child(2){animation-delay:35ms;}
.list .card-wrap:nth-child(3){animation-delay:70ms;}
.list .card-wrap:nth-child(4){animation-delay:105ms;}
.list .card-wrap:nth-child(5){animation-delay:140ms;}
.list .card-wrap:nth-child(6){animation-delay:175ms;}
.list .card-wrap:nth-child(7){animation-delay:210ms;}
.list .card-wrap:nth-child(8){animation-delay:245ms;}
.list .card-wrap:nth-child(n+9){animation-delay:280ms;}

/* FAB: 初回/表示時の軽い bounce-in（scale .8→1 spring）。
   fill は none（既定）にして、終了後は base の translateX(-50%) と :active が効くようにする。
   translateX(-50%) を全 keyframe に内包し、resting transform を壊さない。 */
@keyframes fabIn{
  0%{opacity:0;transform:translateX(-50%) scale(.8);}
  60%{opacity:1;transform:translateX(-50%) scale(1.06);}
  100%{opacity:1;transform:translateX(-50%) scale(1);}
}
.fab{animation:fabIn var(--dur-slow) var(--ease-spring);}
.fab:active{transform:translateX(-50%) scale(.9);}

/* ★評価タップのポップ（選択時に一瞬 scale 1.3→1 spring） */
@keyframes starPop{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
.star-pick span.on{animation:starPop var(--dur) var(--ease-spring);}

/* 同一ドキュメント View Transition（withVT）に方向性のキーフレーム＝躍動的に。
   既定クロスフェードを上書きし、退出は加速・出現はスプリング。reduced-motion は下で無効化 */
::view-transition-old(root){ animation: vtOut 220ms var(--ease-accelerate) both; }
::view-transition-new(root){ animation: vtIn 360ms var(--ease-spring) both; }
@keyframes vtOut{ to{ opacity:0; transform: translateY(-10px) scale(.97);} }
@keyframes vtIn { from{ opacity:0; transform: translateY(16px) scale(1.02);} }

/* ページ間のなめらか遷移（クロスドキュメント View Transitions・未対応は通常遷移） */
@view-transition{ navigation: auto; }
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;}
  /* 同一ドキュメント View Transition（root）も明示無効化 */
  ::view-transition-old(root),::view-transition-new(root){animation:none!important;}
  .list .card-wrap,.fab,.star-pick span.on{animation:none!important;}
}
</style>
</head>

<script>
// ===== データ =====
// 保存キーは絶対に変えない (変えると既存データが読めなくなる)。
// 構造を変える時は migrate() に移行処理を足す。破壊的変更はしない。
const KEY='ramenLog.v1'
const DATA_VERSION=1
const TYPES=['ラーメン','つけ麺','油そば','担々麺','ちゃんぽん','うどん','そば','沖縄そば','そうめん','焼きそば','パスタ','パッタイ','フォー','ビーフン','冷やし中華','冷麺','その他']

let records=load()
let filter='すべて'
let query='',sortBy='new'
let editId=null
let formPhotos=[]
let exifApplied=false
let dateTouched=false
let formType=null
let formStars=0
let formLat=null,formLng=null,formAddress=''
let formTags=new Set()
let activeTag=null

// 読み込み: 旧形式(配列) / 新形式({version,records}) どちらも受ける = 更新でデータを失わない
function load(){
  try{
    const raw=JSON.parse(localStorage.getItem(KEY))
    if(!raw) return []
    const arr=Array.isArray(raw)?raw:(raw.records||[])
    return migrate(arr)
  }catch(e){return []}
}
// 各レコードに不足フィールドを補う(将来の構造変更にも壊れない)
function migrate(arr){
  return arr.filter(Boolean).map(r=>({
    id:r.id||uid(), menu:r.menu||'', shop:r.shop||'',
    type:r.type||null, stars:r.stars||0,
    price:r.price||'', date:r.date||'', memo:r.memo||'', tags:Array.isArray(r.tags)?r.tags:[],
    // photos = 写真の枚数。実体は IndexedDB の "<id>#<i>" キー。
    // photo(旧dataURL) / hasPhoto(旧単一) は移行処理が消費するため一旦保持。
    photos:(typeof r.photos==='number')?r.photos:(r.hasPhoto?1:0),
    photo:r.photo||null, hasPhoto:!!r.hasPhoto,
    lat:(typeof r.lat==='number')?r.lat:null, lng:(typeof r.lng==='number')?r.lng:null,
    address:r.address||'',
  }))
}
function save(){
  localStorage.setItem(KEY,JSON.stringify({version:DATA_VERSION,records,savedAt:new Date().toISOString()}))
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

const $=id=>document.getElementById(id)

// 同一ページ View Transition ヘルパー（未対応/reduced-motion はそのまま実行＝壊れない）
function withVT(fn){
  if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches) return fn()
  return document.startViewTransition(fn)
}

// ===== 写真ストレージ (IndexedDB / Blob) =====
// 写真は容量の大きい IndexedDB に保存。localStorage には文字情報のみ。
const IDB_NAME='menchoDB', IDB_STORE='photos'
let _db=null
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_db)return res(_db)
    const rq=indexedDB.open(IDB_NAME,1)
    rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)}
    rq.onsuccess=()=>{_db=rq.result;res(_db)}
    rq.onerror=()=>rej(rq.error)
  })
}
async function idbPut(id,blob){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(blob,id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function idbGet(id){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error)})}
async function idbDel(id){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}

function dataURLtoBlob(d){
  const [head,b64]=d.split(',');const mime=(head.match(/:(.*?);/)||[])[1]||'image/jpeg'
  const bin=atob(b64),arr=new Uint8Array(bin.length)
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i)
  return new Blob([arr],{type:mime})
}
function blobToDataURL(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob)})}
// 写真は "<recordId>#<index>" キーで複数保存
function pkey(id,i){return `${id}#${i}`}

// 画像を縮小して dataURL 化
function resizeToDataURL(file){
  return new Promise(res=>{
    const reader=new FileReader()
    reader.onload=ev=>{
      const img=new Image()
      img.onload=()=>{
        const max=900,scale=Math.min(1,max/Math.max(img.width,img.height))
        const cv=document.createElement('canvas')
        cv.width=img.width*scale;cv.height=img.height*scale
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height)
        res(cv.toDataURL('image/jpeg',0.8))
      }
      img.onerror=()=>res(null)
      img.src=ev.target.result
    }
    reader.readAsDataURL(file)
  })
}

// EXIF の DateTimeOriginal(0x9003) を読んで 'YYYY-MM-DD' を返す。失敗時 null。
async function getExifDate(file){
  try{
    const buf=await file.arrayBuffer()
    const dv=new DataView(buf)
    if(dv.getUint16(0)!==0xFFD8) return null            // JPEGでない
    let off=2
    while(off+4<dv.byteLength){
      const marker=dv.getUint16(off)
      const size=dv.getUint16(off+2)
      if(marker===0xFFE1){                                // APP1
        const start=off+4
        if(dv.getUint32(start)!==0x45786966) break        // "Exif"
        const tiff=start+6
        const le=dv.getUint16(tiff)===0x4949              // II=little / MM=big
        const u16=o=>dv.getUint16(o,le), u32=o=>dv.getUint32(o,le)
        const ifd0=tiff+u32(tiff+4)
        const find=(base,tag)=>{
          const n=u16(base)
          for(let i=0;i<n;i++){const e=base+2+i*12; if(u16(e)===tag) return e}
          return -1
        }
        const exifPtr=find(ifd0,0x8769)
        if(exifPtr<0) return null
        const exifIfd=tiff+u32(exifPtr+8)
        const dt=find(exifIfd,0x9003)                     // DateTimeOriginal
        if(dt<0) return null
        const vOff=tiff+u32(dt+8)                          // ASCII "YYYY:MM:DD HH:MM:SS"
        let s=''
        for(let i=0;i<10;i++){const c=dv.getUint8(vOff+i); if(!c)break; s+=String.fromCharCode(c)}
        const m=s.match(/^(\d{4}):(\d{2}):(\d{2})/)
        return m?`${m[1]}-${m[2]}-${m[3]}`:null
      }
      if((marker&0xFF00)!==0xFF00) break
      off+=2+size
    }
    return null
  }catch(e){return null}
}

// 表示用 objectURL のキャッシュ
const photoURLs={}
async function getPhotoURL(id){
  if(photoURLs[id])return photoURLs[id]
  try{const b=await idbGet(id);if(!b)return null;const u=URL.createObjectURL(b);photoURLs[id]=u;return u}catch(e){return null}
}
function dropPhotoCache(id){if(photoURLs[id]){URL.revokeObjectURL(photoURLs[id]);delete photoURLs[id]}}
// data-pid を持つ要素に写真を非同期で流し込む
function fillPhotos(root){
  root.querySelectorAll('[data-pid]').forEach(async el=>{
    const u=await getPhotoURL(el.dataset.pid)
    if(u){el.style.backgroundImage=`url("${u}")`;el.style.backgroundSize='cover';el.style.backgroundPosition='center';el.classList.remove('ph');const s=el.querySelector('span');if(s)s.remove()}
  })
}
// 起動時: 旧形式の写真を新スキーム("<id>#<i>") へ一度だけ移行
async function migratePhotosV2(){
  let changed=false
  for(const r of records){
    if(typeof r.photo==='string' && r.photo.startsWith('data:')){
      // 旧: localStorage 内 dataURL → IDB #0
      try{ await idbPut(pkey(r.id,0),dataURLtoBlob(r.photo)); r.photos=1; r.photo=null; r.hasPhoto=false; changed=true }catch(e){}
    } else if(r.hasPhoto && !(r.photos>0)){
      // 旧: 単一IDB(key=id) → #0 へ移設
      try{ const b=await idbGet(r.id); if(b){await idbPut(pkey(r.id,0),b);await idbDel(r.id)} r.photos=b?1:0; r.hasPhoto=false; changed=true }catch(e){}
    } else if(r.hasPhoto && r.photos>0){
      r.hasPhoto=false; changed=true
    }
  }
  if(changed){save();render()}
}

function sortItems(arr){

  switch(sortBy){
    case 'old':       a.sort((x,y)=>(x.date||'').localeCompare(y.date||''));break

// ===== ジェスチャー操作 =====
// カード: タップ=編集 / 左スワイプ=削除
// カード: タップ=詳細 / 左スワイプで「削除」ボタンが出る → それをタップで削除（誤削除防止の2段階）
function attachCard(el){
  const id=el.dataset.id
  const wrap=el.parentElement
  const del=wrap?wrap.querySelector('.card-del'):null
  const OPEN=-84
  let sx=0,sy=0,dx=0,hor=false,open=false
  function setOpen(o){open=o;el.style.transition='transform .2s';el.style.transform=`translateX(${o?OPEN:0}px)`}
  el.addEventListener('touchstart',e=>{
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=open?OPEN:0;hor=false;el.style.transition='none'
  },{passive:true})
  el.addEventListener('touchmove',e=>{
    const mx=e.touches[0].clientX-sx,my=e.touches[0].clientY-sy
    if(!hor && Math.abs(mx)>Math.abs(my)+8) hor=true
    if(hor){ e.preventDefault(); dx=Math.max(-100,Math.min(0,(open?OPEN:0)+mx)); el.style.transform=`translateX(${dx}px)` }
  },{passive:false})
  el.addEventListener('touchend',()=>{ if(hor) setOpen(dx<-42) })
  el.addEventListener('click',()=>{ if(hor)return; if(open){setOpen(false);return} openDetail(id) })
  if(del) del.onclick=()=>{ if(open) deleteRecord(id) }
}
function deleteRecord(id){
  const r=records.find(x=>x.id===id); const n=r?(r.photos||0):0
  records=records.filter(x=>x.id!==id);save();render();toast('削除したよ')
  for(let i=0;i<n;i++){dropPhotoCache(pkey(id,i));idbDel(pkey(id,i)).catch(()=>{})}
  dropPhotoCache(id);idbDel(id).catch(()=>{}) // 旧キーも掃除
}

// シート: 下スワイプで閉じる
function makeSwipeable(sheet,onClose){
  let startY=0,cur=0,drag=false
  sheet.addEventListener('touchstart',e=>{
    if(sheet.scrollTop>2){drag=false;return}
    startY=e.touches[0].clientY;cur=0;drag=true;sheet.style.transition='none'
  },{passive:true})
  sheet.addEventListener('touchmove',e=>{
    if(!drag)return
    cur=e.touches[0].clientY-startY
    if(cur>0){sheet.style.transform=`translateY(${cur}px)`}
  },{passive:true})
  sheet.addEventListener('touchend',()=>{
    if(!drag)return
    drag=false;sheet.style.transition=''
    sheet.style.transform=''
    if(cur>100)onClose()
  })
}

function paintPhoto(){
  const strip=formPhotos.map((d,i)=>`<div class="ps-thumb" style="background-image:url('${d}')"><button type="button" class="ps-x" data-i="${i}">✕</button></div>`).join('')
  $('photoPick').innerHTML=
    (formPhotos.length?`<div class="photo-strip">${strip}</div>`:'')+
    `<div class="pp-empty">
      <button type="button" class="pp-opt" id="ppCam"><span class="pp-ico">📷</span>撮影</button>
      <button type="button" class="pp-opt" id="ppLib"><span class="pp-ico">🖼</span>アルバム</button>
    </div>`
  $('ppCam').onclick=()=>$('camInput').click()
  $('ppLib').onclick=()=>$('libInput').click()
  $('photoPick').querySelectorAll('.ps-x').forEach(b=>b.onclick=ev=>{ev.stopPropagation();formPhotos.splice(+b.dataset.i,1);paintPhoto()})
}
function resetPhotoUI(){formPhotos=[];exifApplied=false;paintPhoto()}

// ===== 店名検索 (OpenStreetMap / 無料) =====
function paintShopLoc(){
  const el=$('shopLoc')
  if(formLat!=null&&formLng!=null){el.classList.add('on');el.textContent='📍 位置設定済み'+(formAddress?'：'+formAddress:'')}
  else{el.classList.remove('on');el.textContent=''}
}
$('shopFind').onclick=async()=>{
  const q=$('f-shop').value.trim()
  if(!q){toast('店名を入れてから検索');return}
  toast('店を検索中…')
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&namedetails=1&addressdetails=1&limit=6&countrycodes=jp&accept-language=ja&q=${encodeURIComponent(q)}`)
    const j=await r.json()
    const box=$('shopResults')
    if(!j.length){box.classList.remove('on');toast('見つからなかった（手入力でもOK）');return}
    box.innerHTML=j.map((p,i)=>{
      const nm=(p.namedetails&&p.namedetails.name)||p.display_name.split(',')[0]
      const addr=p.display_name.split(',').slice(1,4).join('、').trim()
      return `<div class="sr-item" data-i="${i}"><div class="sr-name">${esc(nm)}</div><div class="sr-addr">${esc(addr)}</div></div>`
    }).join('')
    box.classList.add('on')
    box.querySelectorAll('.sr-item').forEach(el=>el.onclick=()=>{
      const p=j[+el.dataset.i]
      $('f-shop').value=(p.namedetails&&p.namedetails.name)||p.display_name.split(',')[0]
      formLat=+p.lat;formLng=+p.lon;formAddress=p.display_name.split(',').slice(0,3).join('、')
      box.classList.remove('on');paintShopLoc()
    })
  }catch(e){toast('検索に失敗（手入力でもOK）')}
}

  $('sheet-title').textContent='麺を記録'

  $('delBtn').classList.add('hidden')
  $('saveBtn').textContent='記録する';$('saveBtn').disabled=false;setMenuError('')
  showSheet()
}
async function openEdit(id){
  const r=records.find(x=>x.id===id);if(!r)return
  editId=id;formType=r.type||null;formStars=r.stars||0;formTags=new Set(r.tags||[])
  formLat=(typeof r.lat==='number')?r.lat:null;formLng=(typeof r.lng==='number')?r.lng:null;formAddress=r.address||''
  // 既存写真をフォーム用 dataURL として読み込む
  formPhotos=[]; exifApplied=true; dateTouched=true   // 編集時は日付を自動上書きしない
  for(let i=0;i<(r.photos||0);i++){const b=await idbGet(pkey(id,i)); if(b)formPhotos.push(await blobToDataURL(b))}
  if(!formPhotos.length && r.photo) formPhotos.push(r.photo)  // 移行前フォールバック
  $('sheet-title').textContent='記録を編集'
  $('f-menu').value=r.menu||'';$('f-shop').value=r.shop||''
  $('f-price').value=r.price||'';$('f-memo').value=r.memo||'';$('f-date').value=r.date||todayStr()
  $('typeGrid').querySelectorAll('.type-opt').forEach(x=>x.classList.toggle('on',x.dataset.t===formType))
  syncTypeAria()
  paintStars();paintPhoto();renderTagChips()
  $('shopResults').classList.remove('on');paintShopLoc()
  $('delBtn').classList.remove('hidden')
  $('saveBtn').textContent='更新する';$('saveBtn').disabled=false;setMenuError('')
  showSheet()
}

// インラインエラー制御（f-menu 用）。toast は補助、インラインが主。
function setMenuError(msg){
  const el=$('f-menu-err'),inp=$('f-menu')
  if(msg){el.textContent=msg;el.classList.add('on');inp.setAttribute('aria-invalid','true')}
  else{el.textContent='';el.classList.remove('on');inp.removeAttribute('aria-invalid')}
}

$('saveBtn').onclick=async()=>{
  const menu=$('f-menu').value.trim()
  if(!menu){
    setMenuError('メニュー名を入力してください')
    toast('メニュー名を入れてね')
    $('f-menu').focus()
    return
  }
  setMenuError('')
  // 二重送信防止＋完了サイン: 押下で即無効化。エラー中断時のみ復帰させる。
  const _btn=$('saveBtn'),_label=_btn.textContent
  _btn.disabled=true;_btn.textContent='保存中…'
  const _fail=()=>{_btn.disabled=false;_btn.textContent=_label}
  try{
  const id=editId||uid()
  const isNew=!editId
  // 写真は IndexedDB へ複数保存（localStorage には入れない）
  const oldCount = editId ? ((records.find(r=>r.id===editId)||{}).photos||0) : 0
  try{
    for(let i=0;i<formPhotos.length;i++){ await idbPut(pkey(id,i),dataURLtoBlob(formPhotos[i])); dropPhotoCache(pkey(id,i)) }
    for(let i=formPhotos.length;i<oldCount;i++){ await idbDel(pkey(id,i)); dropPhotoCache(pkey(id,i)) }
  }catch(e){toast('写真の保存に失敗…')}
  const rec={
    id,
    menu, shop:$('f-shop').value.trim(),
    type:formType, stars:formStars,
    price:$('f-price').value.trim(), date:$('f-date').value.trim()||todayStr(),
    memo:$('f-memo').value.trim(), tags:[...formTags],
    photos:formPhotos.length, photo:null,
    lat:formLat, lng:formLng, address:formAddress,
  }
  if(editId){records=records.map(r=>r.id===editId?rec:r);toast('更新したよ')}
  else{records.unshift(rec);toast('記録したよ')}
  try{save()}catch(e){toast('保存に失敗…')}
  hideSheet();render();celebrateTrophies();if(isNew)celebrate()
  }catch(e){ _fail();toast('保存に失敗…') }  // 予期せぬ中断時はボタンを再度有効化
}

// トロフィー: 新規獲得をトーストで祝う
const TROPHY_KEY='mencho.trophies'
function celebrateTrophies(){
  if(!window.computeAchievements) return
  const all=computeAchievements(records)
  const earned=all.filter(a=>a.earned).map(a=>a.id)
  let seen=[]; try{seen=JSON.parse(localStorage.getItem(TROPHY_KEY)||'[]')}catch(e){}
  const fresh=earned.filter(id=>!seen.includes(id))
  localStorage.setItem(TROPHY_KEY,JSON.stringify(earned))
  fresh.forEach((id,i)=>{const a=all.find(x=>x.id===id); if(a) setTimeout(()=>toast('🏆 '+a.title+' 獲得！'),900+i*1700)})
}

// ===== バックアップ / 復元 =====
function hideBackup(){$('bkMask').classList.remove('on');$('bkSheet').classList.remove('on')}
async function showStoreStatus(){
  const el=$('storeStatus');if(!el)return
  try{
    const p=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false
    let usage=''
    if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();if(e.usage)usage=` ・ 使用 ${(e.usage/1048576).toFixed(1)}MB`}
    el.textContent=(p?'🔒 永続保存：有効':'⚠ 永続保存：未許可（端末容量不足時に消える可能性）')+usage
  }catch(e){el.textContent=''}
}

$('exportBtn').onclick=async()=>{
  toast('バックアップ作成中…')
  // 写真(IDB)も dataURL として同梱し、単体で復元できるバックアップにする
  const out=[]
  for(const r of records){
    const rec={...r}
    rec.photosData=[]
    for(let i=0;i<(r.photos||0);i++){const b=await idbGet(pkey(r.id,i)); if(b)rec.photosData.push(await blobToDataURL(b))}
    delete rec.photo
    out.push(rec)
  }
  const data={app:'mencho',version:DATA_VERSION,exportedAt:new Date().toISOString(),records:out}
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'})
  const url=URL.createObjectURL(blob)
  const a=document.createElement('a')
  a.href=url;a.download=`mencho-backup-${todayStr()}.json`
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)
  toast('バックアップを書き出したよ')
}
$('importBtn').onclick=()=>$('importInput').click()
$('importInput').onchange=e=>{
  const file=e.target.files[0];if(!file)return
  const reader=new FileReader()
  reader.onload=async ev=>{
    try{
      const parsed=JSON.parse(ev.target.result)
      const raw=Array.isArray(parsed)?parsed:(parsed.records||[])
      if(!raw.length){toast('読み込めるデータが無かったよ');return}
      // バックアップ内の写真を IndexedDB(#i)へ移す（migrate前に処理：migrateはphotosDataを落とすため）
      for(const r of raw){
        if(Array.isArray(r.photosData)&&r.photosData.length){
          for(let i=0;i<r.photosData.length;i++){try{await idbPut(pkey(r.id,i),dataURLtoBlob(r.photosData[i]));dropPhotoCache(pkey(r.id,i))}catch(e){}}
          r.photos=r.photosData.length
        } else if(typeof r.photo==='string'&&r.photo.startsWith('data:')){
          try{await idbPut(pkey(r.id,0),dataURLtoBlob(r.photo));r.photos=1;dropPhotoCache(pkey(r.id,0))}catch(e){}
        }
        delete r.photosData; r.photo=null
      }
      const incoming=migrate(raw)
      const byId={}
      records.forEach(r=>byId[r.id]=r)
      incoming.forEach(r=>byId[r.id]=r)
      records=Object.values(byId)
      save();render()
      $('bkMask').classList.remove('on');$('bkSheet').classList.remove('on')
      toast(`${incoming.length}件を復元したよ`)
    }catch(err){toast('ファイルを読めなかった…')}
    finally{e.target.value=''}
  }
  reader.readAsText(file)
}

// 保存時の可愛い演出
function celebrate(){
  const c=$('celebrate'); if(!c)return
  for(let i=0;i<10;i++){
    const s=document.createElement('span'); s.className='cele'
    s.textContent=(i%3===0)?'✦':'♡'
    s.style.left=(50+(Math.random()*22-11))+'%'
    s.style.fontSize=(16+Math.random()*18)+'px'
    s.style.color=(Math.random()<.5)?'var(--tint)':'var(--yellow)'
    s.style.setProperty('--dx',(Math.random()*200-100)+'px')
    s.style.setProperty('--rot',(Math.random()*60-30)+'deg')
    s.style.animationDelay=(Math.random()*0.12)+'s'
    c.appendChild(s); setTimeout(()=>s.remove(),1300)
  }
}
// 写真の全画面ビューア（ピンチズーム / パン / ダブルタップ）
let vScale=1,vx=0,vy=0,_d=0,_sc=1,_sx=0,_sy=0,_tx=0,_ty=0,_mode=null,_lastTap=0
function _applyV(){$('viewerImg').style.transform=`translate(${vx}px,${vy}px) scale(${vScale})`}
function openViewer(src){vScale=1;vx=0;vy=0;$('viewerImg').src=src;_applyV();$('viewer').classList.add('on')}
function closeViewer(){$('viewer').classList.remove('on');$('viewerImg').src=''}
function _dist(e){const a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
;(function(){
  const v=$('viewer'); if(!v)return
  $('viewerClose').onclick=closeViewer
  v.addEventListener('click',e=>{
    if(e.target.id==='viewerImg'){const now=Date.now();if(now-_lastTap<300){vScale=vScale>1?1:2;vx=0;vy=0;_applyV()}_lastTap=now}
    else closeViewer()
  })
  v.addEventListener('touchstart',e=>{
    if(e.touches.length===2){_mode='pinch';_d=_dist(e);_sc=vScale}
    else if(e.touches.length===1){_mode='pan';_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;_tx=vx;_ty=vy}
  },{passive:false})
  v.addEventListener('touchmove',e=>{
    if(_mode==='pinch'&&e.touches.length===2){e.preventDefault();vScale=Math.max(1,Math.min(5,_sc*_dist(e)/_d));_applyV()}
    else if(_mode==='pan'&&e.touches.length===1&&vScale>1){e.preventDefault();vx=_tx+(e.touches[0].clientX-_sx);vy=_ty+(e.touches[0].clientY-_sy);_applyV()}
  },{passive:false})
  v.addEventListener('touchend',e=>{if(e.touches.length===0){_mode=null;if(vScale<=1){vx=0;vy=0;_applyV()}}})
})();

}
