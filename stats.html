<style>
/* ============================================================
   麺帳 分析 — Material Design 3 reskin（index.html と同一トークン）
   データが主役、UIシェルは控えめ。M3 26カラーロール(light/dark)。
   primary=暖色シード #8F4E00。草/カレンダー/バーは primary 不透明度スケール。
   JS・id・class・データキーは一切変更していない（見た目層のみ）。
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}

:root{
  /* === M3 カラーロール（Light・暖色シード #8F4E00）: index.html と同一 === */
  --md-primary:#8F4E00; --md-on-primary:#FFFFFF;
  --md-primary-container:#FFDCC2; --md-on-primary-container:#2E1500;
  --md-secondary:#755844; --md-on-secondary:#FFFFFF;
  --md-secondary-container:#FFDCC2; --md-on-secondary-container:#2A1706;
  --md-tertiary:#5F6234; --md-on-tertiary:#FFFFFF;
  --md-tertiary-container:#E5E8AD; --md-on-tertiary-container:#1B1D00;
  --md-error:#BA1A1A; --md-on-error:#FFFFFF;
  --md-error-container:#FFDAD6; --md-on-error-container:#410002;
  --md-surface:#FFF8F5; --md-on-surface:#211A15; --md-on-surface-variant:#52443B;
  --md-surface-container-lowest:#FFFFFF; --md-surface-container-low:#FFF1E9;
  --md-surface-container:#FCEBE0; --md-surface-container-high:#F6E5DA;
  --md-surface-container-highest:#F0E0D5;
  --md-outline:#85736A; --md-outline-variant:#D7C3B7;
  --md-star:#9C7207;

  --label:var(--md-on-surface);
  --secondary-label:var(--md-on-surface-variant);
  --tertiary-label:var(--md-outline);
  --bg:var(--md-surface);
  --bg-elevated:var(--md-surface-container-low);
  --separator:var(--md-outline-variant);
  --separator-weak:var(--md-outline-variant);
  --fill:var(--md-surface-container-high);
  --fill-2:var(--md-surface-container);
  --tint:var(--md-primary);
  --tint-weak:var(--md-primary-container);
  --on-tint:var(--md-on-primary);
  --red:var(--md-error);
  --green:#2E6B3E;
  --yellow:var(--md-star);
  --star-off:var(--md-outline-variant);
  --focus:var(--md-primary);
  /* 草/カレンダーの濃淡: primary(#8F4E00)系の不透明度スケール（暖色ヒート） */
  --heat-0:var(--md-surface-container);
  --heat-1:rgba(143,78,0,.22);
  --heat-2:rgba(143,78,0,.42);
  --heat-3:rgba(143,78,0,.66);
  --heat-4:rgba(143,78,0,.92);
  --on-heat-strong:#FFFFFF;          /* 濃いセル上のテキスト（lv2/lv3） */
  --font-sys:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,-apple-system,sans-serif;
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;--r-full:999px;
  --r-card:var(--r-lg);--r-ctl:var(--r-md);
}
@media (prefers-color-scheme:dark){
  :root{
    --md-primary:#FFB77C; --md-on-primary:#4A2800;
    --md-primary-container:#6C3A00; --md-on-primary-container:#FFDCC2;
    --md-secondary:#E4BFA8; --md-on-secondary:#422B1B;
    --md-secondary-container:#5B4130; --md-on-secondary-container:#FFDCC2;
    --md-tertiary:#C9CC93; --md-on-tertiary:#31340A;
    --md-tertiary-container:#474A1F; --md-on-tertiary-container:#E5E8AD;
    --md-error:#FFB4AB; --md-on-error:#690005;
    --md-error-container:#93000A; --md-on-error-container:#FFDAD6;
    --md-surface:#19120D; --md-on-surface:#F0E0D5; --md-on-surface-variant:#D7C3B7;
    --md-surface-container-lowest:#130C08; --md-surface-container-low:#211A14;
    --md-surface-container:#261D17; --md-surface-container-high:#312720;
    --md-surface-container-highest:#3C322B;
    --md-outline:#9F8D82; --md-outline-variant:#52443B;
    --md-star:#F4C95D;
    --green:#7CD58F;
    --heat-0:var(--md-surface-container);
    --heat-1:rgba(255,183,124,.26);
    --heat-2:rgba(255,183,124,.46);
    --heat-3:rgba(255,183,124,.68);
    --heat-4:rgba(255,183,124,.95);
    --on-heat-strong:#19120D;
  }
}

html,body{height:100%;}
html{background-color:var(--bg);}
body{font-family:var(--font-sys);color:var(--label);background-color:var(--bg);
  min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.5;letter-spacing:.01em;}
.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 40px);}

/* グローバル: フォーカスリング & reduced-motion (WCAG 2.4.7 / 2.3) */
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px;}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important;}
}

/* ===== 戻る（iOS NavBar 風 back） ===== */
.back{display:inline-flex;align-items:center;gap:2px;min-height:48px;
  font-size:15px;font-weight:600;color:var(--md-primary);text-decoration:none;margin:0 -6px 2px;
  padding:0 6px;border-radius:8px;}
.back:active{opacity:.55;}

/* ===== Large Title「分析」 ===== */
.title{font-size:32px;line-height:40px;font-weight:900;color:var(--md-on-surface);
  letter-spacing:-.01em;margin:2px 0 18px;}

/* ===== 概要 stats: M3 elevated カード（tonal） ===== */
.stats{display:flex;background:var(--md-surface-container-low);border-radius:var(--r-lg);
  overflow:hidden;margin-bottom:22px;border:1px solid var(--md-outline-variant);}
.stat{flex:1;padding:16px 4px;text-align:center;position:relative;}
.stat + .stat::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--separator-weak);}
.stat .v{font-size:22px;font-weight:700;color:var(--label);line-height:1.1;font-variant-numeric:tabular-nums;}
.stat .v small{font-size:13px;font-weight:600;color:var(--secondary-label);margin-left:1px;}
.stat .l{font-size:12px;color:var(--secondary-label);margin-top:6px;font-weight:400;letter-spacing:.2px;}

/* ===== セクション: iOS インセットグループ =====
   .sec 全体を 1 枚のインセットカードにする。.sec-h は枠外ラベル風に上へ出す。
   こうすることで、中身が単一ラッパ(#grass/#cal/.hall/.shops)でも
   複数の .bar-row 直下兄弟でも一貫してカード化される。 */
.sec{margin-bottom:26px;background:var(--md-surface-container-low);border-radius:var(--r-lg);
  padding:16px;border:1px solid var(--md-outline-variant);}
.sec-h{font-size:13px;font-weight:600;letter-spacing:.3px;color:var(--secondary-label);
  text-transform:none;
  /* カード上端の外側にラベルを出す（iOS グループヘッダ風） */
  margin:-4px 4px 12px;}
/* streaks は親 .sec がカードなので二重カードを避け、内側の分割線だけ残す */
.sec > .streaks{box-shadow:none;border-radius:0;margin:-16px;background:transparent;}

/* ===== バー（月別/ジャンル別/★分布）= tint ===== */
.bar-row{display:flex;align-items:center;gap:12px;}
.bar-row + .bar-row{margin-top:12px;}
.bar-label{width:60px;flex-shrink:0;font-size:15px;font-weight:400;color:var(--label);
  font-variant-numeric:tabular-nums;}
.bar-track{flex:1;height:10px;background:var(--fill);border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;background:var(--tint);border-radius:5px;min-width:3px;}
.bar-val{width:56px;flex-shrink:0;text-align:right;font-size:15px;font-weight:600;color:var(--label);
  font-variant-numeric:tabular-nums;}
.bar-val small{color:var(--secondary-label);font-weight:400;font-size:13px;margin-left:1px;}

/* ===== 連続記録 streaks: 分割インセットカード ===== */
.streaks{display:flex;background:var(--md-surface-container-low);border-radius:var(--r-lg);
  overflow:hidden;}
.sk{flex:1;padding:16px 4px;text-align:center;position:relative;}
.sk + .sk::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--separator-weak);}
.sk-v{font-size:22px;font-weight:700;color:var(--label);font-variant-numeric:tabular-nums;}
.sk-v small{font-size:13px;font-weight:600;color:var(--secondary-label);margin-left:1px;}
.sk-l{font-size:12px;color:var(--secondary-label);margin-top:6px;font-weight:400;letter-spacing:.2px;}

/* ===== 麺活グラフ（草・tint 不透明度スケール） ===== */
.grass-scroll{overflow-x:auto;scrollbar-width:none;padding-bottom:4px;}
.grass-scroll::-webkit-scrollbar{display:none;}
.grass-inner{width:max-content;}
.grass-cols{display:flex;gap:3px;}
.g-col{display:flex;flex-direction:column;gap:3px;}
.g-cell{width:12px;height:12px;border-radius:3px;background:var(--heat-0);}
.g-mrow{display:flex;gap:3px;margin-bottom:4px;}
.g-mlabel{width:12px;font-size:11px;color:var(--secondary-label);white-space:nowrap;font-weight:400;}
.g0{background:var(--heat-0);}
.g1{background:var(--heat-1);}
.g2{background:var(--heat-2);}
.g3{background:var(--heat-3);}
.g4{background:var(--heat-4);}

/* ===== カレンダー ===== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-size:17px;font-weight:600;color:var(--label);font-variant-numeric:tabular-nums;}
.cal-nav{min-width:44px;min-height:44px;width:44px;height:44px;border:none;background:var(--fill);
  border-radius:50%;font-size:18px;font-weight:600;cursor:pointer;color:var(--tint);
  display:inline-flex;align-items:center;justify-content:center;transition:background .15s ease,transform .1s ease;}
.cal-nav:hover{background:var(--fill-2);}
.cal-nav:active{transform:scale(.92);background:var(--tint-weak);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-wd{margin-bottom:6px;}
.cal-wd-c{text-align:center;font-size:12px;color:var(--secondary-label);font-weight:400;}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;
  border-radius:8px;color:var(--label);background:var(--heat-0);font-variant-numeric:tabular-nums;}
.cal-cell.empty{background:transparent;}
.cal-cell.lv0{background:var(--heat-0);color:var(--secondary-label);}
.cal-cell.lv1{background:var(--heat-1);color:var(--label);}
.cal-cell.lv2{background:var(--heat-3);color:var(--on-heat-strong);}
.cal-cell.lv3{background:var(--heat-4);color:var(--on-heat-strong);}
.cal-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;margin-top:12px;
  font-size:12px;color:var(--secondary-label);}
.lg{width:14px;height:14px;border-radius:3px;display:inline-block;}
.lg.lv0{background:var(--heat-0);}.lg.lv1{background:var(--heat-1);}.lg.lv2{background:var(--heat-3);}.lg.lv3{background:var(--heat-4);}
.lg.g0{background:var(--heat-0);}.lg.g1{background:var(--heat-1);}.lg.g2{background:var(--heat-2);}.lg.g3{background:var(--heat-3);}.lg.g4{background:var(--heat-4);}

/* ===== 殿堂 ===== */
.hall{display:flex;flex-direction:column;gap:14px;}
.hall-item{display:flex;align-items:center;gap:12px;}
.hall-rank{width:22px;flex-shrink:0;font-size:15px;font-weight:600;color:var(--secondary-label);
  text-align:center;font-variant-numeric:tabular-nums;}
.hall-photo{width:52px;height:52px;flex-shrink:0;border-radius:10px;background:var(--fill);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--secondary-label);
  font-weight:400;overflow:hidden;}
.hall-photo img{width:100%;height:100%;object-fit:cover;}
.hall-body{flex:1;min-width:0;}
.hall-menu{font-size:17px;font-weight:600;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hall-shop{font-size:13px;color:var(--secondary-label);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hall-stars{font-size:13px;letter-spacing:1px;margin-top:3px;color:var(--yellow);}

/* ===== お店 ===== */
.shops{display:flex;flex-direction:column;}
.shop{display:flex;align-items:center;gap:12px;min-height:44px;padding:12px 0;
  border-bottom:1px solid var(--separator-weak);text-decoration:none;color:inherit;}
.shop:first-child{padding-top:0;}
.shop:last-child{border-bottom:none;padding-bottom:0;}
.shop:active{opacity:.6;}
.shop-body{flex:1;min-width:0;}
.shop-name{font-size:17px;font-weight:600;color:var(--label);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.shop-sub{font-size:13px;color:var(--secondary-label);margin-top:2px;font-variant-numeric:tabular-nums;}
.shop-count{flex-shrink:0;text-align:right;}
.shop-count b{font-size:20px;font-weight:700;color:var(--tint);font-variant-numeric:tabular-nums;}
.shop-count span{font-size:11px;color:var(--secondary-label);display:block;}
.shop-arrow{color:var(--tertiary-label);font-weight:400;font-size:20px;}

.none{padding:24px 0;text-align:center;color:var(--secondary-label);font-size:15px;}
.empty-all{padding:100px 24px;text-align:center;color:var(--secondary-label);background:transparent!important;box-shadow:none!important;padding-block:100px;}
.empty-all .t{font-size:17px;font-weight:600;color:var(--label);}

/* アプリ的挙動: 長押しの文字選択を無効 / プルto更新を無効 */
html,body{overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}

/* モーダル/ビューア表示中は背景をロック（スワイプ貫通防止） */
html:has(.mask.on),body:has(.mask.on),html:has(#viewer.on),body:has(#viewer.on){overflow:hidden;}
.sheet{overscroll-behavior:contain;}
.mask{touch-action:none;overscroll-behavior:none;} /* 暗幕もスクロール不可 */

/* ページ間のなめらか遷移（クロスドキュメント View Transitions・未対応は通常遷移） */
@view-transition{ navigation: auto; }
@media (prefers-reduced-motion: reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;}
}

/* ページ間遷移を躍動的に（index と統一） */
::view-transition-old(root){ animation: vtOut 220ms cubic-bezier(.3,0,.8,.15) both; }
::view-transition-new(root){ animation: vtIn 360ms cubic-bezier(.34,1.56,.64,1) both; }
@keyframes vtOut{ to{opacity:0;transform:translateY(-10px) scale(.97);} }
@keyframes vtIn{ from{opacity:0;transform:translateY(16px) scale(1.02);} }
@media (prefers-reduced-motion: reduce){ ::view-transition-old(root),::view-transition-new(root){animation:none!important;} }
</style>

<body>
<main class="wrap">
  <a class="back" href="index.html" aria-label="麺帳にもどる">‹ 麺帳にもどる</a>
  <h1 class="title">分析</h1>
  <div id="content"></div>
</main>

<script>
// ===== データ読み込み (index.html と同じ localStorage) =====
const KEY='ramenLog.v1'
function loadRecords(){
  try{const raw=JSON.parse(localStorage.getItem(KEY));if(!raw)return [];return Array.isArray(raw)?raw:(raw.records||[])}
  catch(e){return []}
}
const records=loadRecords()
const $=id=>document.getElementById(id)
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(5-n)}

// ===== 写真 (IndexedDB) — 殿堂のサムネ用 =====
const IDB_NAME='menchoDB',IDB_STORE='photos';let _db=null
function idbOpen(){return new Promise((res,rej)=>{if(_db)return res(_db);const rq=indexedDB.open(IDB_NAME,1);
  rq.onupgradeneeded=()=>{const db=rq.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE)};
  rq.onsuccess=()=>{_db=rq.result;res(_db)};rq.onerror=()=>rej(rq.error)})}
async function idbGet(id){try{const db=await idbOpen();return await new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const rq=tx.objectStore(IDB_STORE).get(id);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error)})}catch(e){return null}}
async function fillPhotos(root){
  for(const el of root.querySelectorAll('[data-pid]')){
    const b=await idbGet(el.dataset.pid)
    if(b){const u=URL.createObjectURL(b);const img=document.createElement('img');img.src=u;el.replaceChildren(img)}
  }
}

function bar(label,val,max,unit){
  const w=max>0?Math.round(val/max*100):0
  return `<div class="bar-row"><div class="bar-label">${esc(label)}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div>
    <div class="bar-val">${val}<small>${unit||''}</small></div></div>`
}

function render(){
  if(!records.length){
    $('content').innerHTML='<div class="empty-all"><div class="t">まだ記録がないよ</div></div>'
    return
  }
  // 概要
  const total=records.reduce((a,r)=>a+(Number(r.price)||0),0)
  const rated=records.filter(r=>r.stars>0)
  const avg=rated.length?(rated.reduce((a,r)=>a+r.stars,0)/rated.length):0
  const gc={};records.forEach(r=>{if(r.type)gc[r.type]=(gc[r.type]||0)+1})
  const mfn=Object.entries(gc).sort((a,b)=>b[1]-a[1])[0]
  let html=`<div class="stats">
    <div class="stat"><div class="v">${records.length}</div><div class="l">杯</div></div>
    <div class="stat"><div class="v">¥${total.toLocaleString()}</div><div class="l">合計</div></div>
    <div class="stat"><div class="v">${avg?avg.toFixed(1):'–'}<small>★</small></div><div class="l">平均</div></div>
    <div class="stat"><div class="v" style="font-size:14px">${mfn?esc(mfn[0]):'–'}</div><div class="l">MFN</div></div>
  </div>`

  // 連続記録
  const st=window.computeStreak?computeStreak(records):{current:0,longest:0,days:0}
  html+=`<div class="sec"><div class="sec-h">連続記録</div>
    <div class="streaks">
      <div class="sk"><div class="sk-v">${st.current}<small>日</small></div><div class="sk-l">現在の連続</div></div>
      <div class="sk"><div class="sk-v">${st.longest}<small>日</small></div><div class="sk-l">最長連続</div></div>
      <div class="sk"><div class="sk-v">${st.days}<small>日</small></div><div class="sk-l">麺活した日数</div></div>
    </div></div>`

  // 麺活グラフ（GitHubの草風・過去1年）
  html+=`<div class="sec"><div class="sec-h">麺活グラフ（過去1年）</div><div id="grass"></div></div>`

  // 麺活カレンダー（月別）
  html+=`<div class="sec"><div class="sec-h">麺活カレンダー</div><div id="cal"></div></div>`

  // 月別
  const mc={};records.forEach(r=>{if(r.date){const k=r.date.slice(0,7);mc[k]=mc[k]||{n:0,y:0};mc[k].n++;mc[k].y+=Number(r.price)||0}})
  const months=Object.keys(mc).sort().slice(-12)
  if(months.length){
    const max=Math.max(...months.map(m=>mc[m].n))
    html+=`<div class="sec"><div class="sec-h">月別の杯数</div>${
      months.map(m=>{const[y,mm]=m.split('-');return bar(`${y.slice(2)}/${mm}`,mc[m].n,max,'杯')}).join('')
    }</div>`
  }

  // ジャンル別
  const genres=Object.entries(gc).sort((a,b)=>b[1]-a[1])
  if(genres.length){
    const max=genres[0][1]
    html+=`<div class="sec"><div class="sec-h">ジャンル別</div>${
      genres.map(([g,n])=>bar(g,n,max,'杯')).join('')
    }</div>`
  }

  // ★分布
  if(rated.length){
    const dist=[5,4,3,2,1].map(s=>({s,n:records.filter(r=>r.stars===s).length}))
    const max=Math.max(...dist.map(d=>d.n))
    html+=`<div class="sec"><div class="sec-h">評価の分布</div>${
      dist.map(d=>bar('★'+d.s,d.n,max,'')).join('')
    }</div>`
  }

  // 殿堂 (★4以上)
  const hall=records.filter(r=>r.stars>=4).sort((a,b)=>(b.stars-a.stars)||((b.date||'').localeCompare(a.date||''))).slice(0,12)
  html+=`<div class="sec"><div class="sec-h">殿堂入り（★4以上）</div>`
  if(hall.length){
    html+=`<div class="hall">${hall.map((r,i)=>`
      <div class="hall-item">
        <div class="hall-rank">${i+1}</div>
        <div class="hall-photo" ${(r.photo||r.hasPhoto)?`data-pid="${r.id}"`:''}>${r.photo?`<img src="${r.photo}">`:(r.hasPhoto?'':'麺')}</div>
        <div class="hall-body">
          <div class="hall-menu">${esc(r.menu)||'（無題）'}</div>
          <div class="hall-shop">${esc(r.shop)||'お店未設定'}</div>
          <div class="hall-stars">${starStr(r.stars)}</div>
        </div>
      </div>`).join('')}</div>`
  }else html+=`<div class="none">★4以上の記録がまだないよ</div>`
  html+=`</div>`

  // お店ごと
  const sc={}
  records.forEach(r=>{const s=(r.shop||'').trim();if(!s)return;
    sc[s]=sc[s]||{n:0,star:0,rated:0,y:0,last:''}
    sc[s].n++;sc[s].y+=Number(r.price)||0
    if(r.stars>0){sc[s].star+=r.stars;sc[s].rated++}
    if((r.date||'')>sc[s].last)sc[s].last=r.date||''
  })
  const shops=Object.entries(sc).sort((a,b)=>b[1].n-a[1].n)
  html+=`<div class="sec"><div class="sec-h">お店ごとのまとめ</div>`
  if(shops.length){
    html+=`<div class="shops">${shops.map(([s,d])=>{
      const av=d.rated?(d.star/d.rated).toFixed(1)+'★':'–'
      return `<a class="shop" href="index.html?q=${encodeURIComponent(s)}">
        <div class="shop-body">
          <div class="shop-name">${esc(s)}</div>
          <div class="shop-sub">平均 ${av} ・ ¥${d.y.toLocaleString()} ・ 最終 ${d.last||'–'}</div>
        </div>
        <div class="shop-count"><b>${d.n}</b><span>杯</span></div>
        <div class="shop-arrow">›</div>
      </a>`
    }).join('')}</div>`
  }else html+=`<div class="none">お店名つきの記録がまだないよ</div>`
  html+=`</div>`

  $('content').innerHTML=html
  fillPhotos($('content'))
  renderGrass()
  renderCalendar()
}

// 麺活グラフ（過去1年・週=列 / 曜日=行）
function renderGrass(){
  const el=$('grass'); if(!el) return
  const counts={}; records.forEach(r=>{if(r.date)counts[r.date]=(counts[r.date]||0)+1})
  const toISO=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`
  const end=new Date(); end.setHours(0,0,0,0)
  const start=new Date(end); start.setDate(start.getDate()-364); start.setDate(start.getDate()-start.getDay()) // 日曜起点
  const WK=['日','月','火','水','木','金','土']
  // 月ラベル（週ごとに月が変わったら表示）
  const weeks=[]; let week=[]; const cur=new Date(start)
  while(cur<=end){
    const iso=toISO(cur), c=counts[iso]||0
    const lvl=c===0?0:c===1?1:c===2?2:c===3?3:4
    week.push(`<div class="g-cell g${lvl}" title="${iso} ・ ${c}杯"></div>`)
    if(cur.getDay()===6){weeks.push({cells:week,m:cur.getMonth()}); week=[]}
    cur.setDate(cur.getDate()+1)
  }
  if(week.length)weeks.push({cells:week,m:end.getMonth()})
  let lastM=-1
  const labels=weeks.map(w=>{const show=w.m!==lastM; lastM=w.m; return `<div class="g-mlabel">${show?(w.m+1)+'月':''}</div>`}).join('')
  const cols=weeks.map(w=>`<div class="g-col">${w.cells.join('')}</div>`).join('')
  el.innerHTML=`
    <div class="grass-scroll">
      <div class="grass-inner">
        <div class="g-mrow">${labels}</div>
        <div class="grass-cols">${cols}</div>
      </div>
    </div>
    <div class="cal-legend">少 <i class="lg g0"></i><i class="lg g1"></i><i class="lg g2"></i><i class="lg g3"></i><i class="lg g4"></i> 多</div>`
}

// 麺活カレンダー (月送り)
let calY,calM
function renderCalendar(){
  const cal=$('cal'); if(!cal) return
  if(calY===undefined){const n=new Date();calY=n.getFullYear();calM=n.getMonth()}
  const counts={}; records.forEach(r=>{if(r.date)counts[r.date]=(counts[r.date]||0)+1})
  const startDow=new Date(calY,calM,1).getDay()
  const dim=new Date(calY,calM+1,0).getDate()
  const wd=['日','月','火','水','木','金','土']
  let cells=''
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`
  for(let d=1;d<=dim;d++){
    const iso=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`
    const c=counts[iso]||0
    const lvl=c===0?0:c===1?1:c===2?2:3
    cells+=`<div class="cal-cell lv${lvl}">${d}</div>`
  }
  cal.innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <span class="cal-title">${calY}年${calM+1}月</span>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid cal-wd">${wd.map(w=>`<div class="cal-wd-c">${w}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend">少 <i class="lg lv0"></i><i class="lg lv1"></i><i class="lg lv2"></i><i class="lg lv3"></i> 多</div>`
  $('calPrev').onclick=()=>{calM--; if(calM<0){calM=11;calY--} renderCalendar()}
  $('calNext').onclick=()=>{calM++; if(calM>11){calM=0;calY++} renderCalendar()}
}
render()
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
